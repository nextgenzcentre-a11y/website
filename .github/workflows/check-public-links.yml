name: Audit public links and sitemap
on:
  workflow_dispatch:
  push:
    branches: [mai]
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - 'assets/**'
      - 'programmes/**'
      - 'guides/**'
      - 'services/**'
      - 'about-nextgenz-centre.html'
      - 'why-malaysia.html'
      - 'ar/**'
      - 'zh/**'
      - 'scripts/check_public_links.py'
      - '.github/workflows/check-public-links.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out NextGenz website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check all public links and sitemap targets
        run: python scripts/check_public_links.py
