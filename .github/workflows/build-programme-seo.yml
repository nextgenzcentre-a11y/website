name: Publish crawlable university programme SEO pages
on:
  workflow_dispatch:
  push:
    branches: [mai]
    paths:
      - 'index.html'
      - 'scripts/build_programme_seo.py'
      - 'scripts/programme_finder_standalone.py'
      - 'scripts/programme_actions.py'
      - 'scripts/programme_languages.py'
      - 'scripts/check_programme_catalogue.py'
      - 'scripts/check_public_theme.py'
      - 'scripts/check_public_metadata.py'
      - 'scripts/check_programme_layout.mjs'
      - 'scripts/site_header.py'
      - 'scripts/site_shell.py'
      - 'scripts/programme_topics.py'
      - 'scripts/programme_level_subjects.py'
      - 'scripts/programme_subject_enrichment.py'
      - 'scripts/programme_verified_facts.py'
      - 'guides/style.css'
      - 'guides/**/*.html'
      - 'services/**/*.html'
      - 'ar/**/*.html'
      - 'zh/**/*.html'
      - 'about-nextgenz-centre.html'
      - 'why-malaysia.html'
      - 'assets/why-malaysia.css'
      - '.github/workflows/build-programme-seo.yml'

permissions:
  contents: write

concurrency:
  group: nextgenz-programme-seo-mai
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the public website
        uses: actions/checkout@v4
        with:
          ref: mai
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate programme pages directly from index.html database
        run: |
          python -m py_compile scripts/build_programme_seo.py
          python scripts/build_programme_seo.py
      - name: Validate sitemap and representative programme pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          data=json.loads(Path("programmes/catalog-manifest.json").read_text())
          assert data["universities"] >= 25
          assert data["programme_listings"] >= 1100
          assert data["detailed_programme_pages"] >= 40
          assert len(list(Path("programmes/universities").glob("*.html"))) == data["universities"]
          assert Path("programmes/levels/foundation.html").is_file()
          assert Path("programmes/index.html").is_file()
          finder=Path("programmes/find/index.html")
          assert finder.is_file() and "Find a course that fits your future" in finder.read_text()
          assert 'href="/programmes/courses/' in finder.read_text()
          assert Path("programmes/site-assets/find-course.js").is_file()
          assert Path("programmes/subjects/index.html").is_file()
          master=Path("programmes/subjects/master-computer-science-malaysia.html").read_text()
          assert "MMU's current programme page" in master
          assert "Need a Master in Computer Science Malaysia education consultant?" in master
          assert "https://admission.utm.my/programmes/master-of-computer-science-odl/" in master
          assert data["generated_level_subject_pages"] >= 20
          assert len(list(Path("programmes/subjects").glob("*-malaysia.html"))) >= 20
          root=ET.parse("sitemap.xml").getroot()
          assert len(root) > 80, len(root)
          print("PASS: all", len(root), "URLs,",
                data["programme_listings"], "programme entries")
          PY
      - name: Check every public page matches the NextGenz design and uses existing photo assets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys
          sys.path.insert(0,"scripts")
          from site_header import header_html, BRAND_CREST
          import re
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.images=[]
                  self.h1=0
                  self.styles=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=="img":
                      self.images.append(a)
                  elif tag=="h1":
                      self.h1+=1
                  elif tag=="link" and a.get("rel")=="stylesheet":
                      self.styles.append(a.get("href",""))
          docs = list(Path("programmes").rglob("*.html"))
          docs += [p for path in ("guides","services","ar","zh")
                   for p in Path(path).rglob("*.html")]
          docs += [Path("about-nextgenz-centre.html")]
          assert len(docs) >= 154, "Unexpectedly missing SEO pages"
          for file in docs:
              raw=file.read_text(encoding="utf-8")
              parsed=Page()
              parsed.feed(raw)
              # Every SEO page must use the exact original homepage crest,
              # matching white/gold wordmark and the canonical navbar.
              path=str(file)
              lang="ar" if path.startswith("ar/") else "zh" if path.startswith("zh/") else "en"
              assert "<header class=\"nav ng-brand-header\" dir=\"ltr\">" in raw, f"{file}: old text-only header remains"
              header=raw[raw.index('<header class="nav ng-brand-header"'):raw.index("</header>")+len("</header>")]
              catalogue = "/" + path.removesuffix("index.html") if path.startswith("programmes/") else ""
              for locale in ("ar","zh"):
                  if catalogue.startswith("/programmes/"+locale+"/"):
                      lang=locale
                      catalogue=catalogue.replace("/programmes/"+locale+"/","/programmes/",1)
              page_path = "/" + path.removesuffix("index.html")
              assert header == header_html(lang,catalogue,page_path=page_path), f"{file}: navigation drift from original brand template"
              assert BRAND_CREST in header, f"{file}: original crest missing"
              assert parsed.h1==1, f"{file}: expected one H1, got {parsed.h1}"
              assert parsed.images, f"{file}: missing photography"
              assert "/guides/style.css?v=20261119-landing" in parsed.styles, f"{file}: outdated or inconsistent stylesheet"
              for entry in parsed.images:
                  src=entry.get("src","")
                  if src.startswith("/assets/"):
                      local=Path(src.split("?",1)[0].lstrip("/"))
                      assert local.is_file(), f"{file}: missing image asset {src}"
                  assert entry.get("alt", "").strip(), f"{file}: photo without descriptive alt text"
              if str(file).startswith("programmes/"):
                  assert "ng-hero-media" in raw, f"{file}: missing homepage-style photo hero"
          css=Path("guides/style.css").read_text()
          assert "Montserrat" in css and "#C5A059" in css and "Bangers" in css
          print("PASS: checked",len(docs),"public pages, typography and all local image paths")
          PY
      - name: Verify catalogue links and fee enquiries
        run: python scripts/check_programme_catalogue.py
      - name: Audit all public page palettes, finder fees and translated layout parity
        run: python scripts/check_public_theme.py
      - name: Verify SEO title uniqueness, canonicals and locale alternate paths
        run: python scripts/check_public_metadata.py
      - name: Compare representative layouts on mobile and desktop
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/check_programme_layout.mjs
      - name: Commit generated programme content and synchronized public HTML
        run: |
          git config user.name "nextgenzcentre-a11y"
          git config user.email "nextgenzcentre@gmail.com"
          # The site-shell sync also updates translated guides and shared
          # public headers/footers. Include those generated HTML edits so
          # rebase never fails because the working tree is dirty.
          git add --all programmes/ sitemap.xml ar/ zh/ guides/ services/ about-nextgenz-centre.html why-malaysia.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Publish search-readable university and programme directories"
          # Another editor may have pushed to mai during our 1,182-page build.
          # Rebase and retry ordinary pushes without ever forcing the branch.
          for attempt in 1 2 3 4; do
            git fetch origin mai
            if ! git rebase origin/mai; then
              git rebase --abort || true
              echo "Generated files overlap another source edit. Let the newer build handle it."
              exit 1
            fi
            if git push origin HEAD:mai; then
              echo "Published generated programme pages"
              exit 0
            fi
            echo "Branch changed during publishing; retrying ($attempt/4)"
            sleep $((attempt * 2))
          done
          echo "Unable to publish generated pages after four safe retries"
          exit 1
