students: JSON.parse(JSON.stringify(students)),
requests: JSON.parse(JSON.stringify(requests)),
messages: JSON.parse(JSON.stringify(messages))
}]);
setRedoStack([]); // Clear redo on new action
};
const handleUndo = () => {
if (undoStack.length === 0) return;
const previousState = undoStack[undoStack.length - 1];
setRedoStack((prev) => [{
users: JSON.parse(JSON.stringify(users)),
students: JSON.parse(JSON.stringify(students)),
requests: JSON.parse(JSON.stringify(requests)),
messages: JSON.parse(JSON.stringify(messages))
}, ...prev]);
setUndoStack((prev) => prev.slice(0, prev.length - 1));
setUsers(previousState.users);
setStudents(previousState.students);
setRequests(previousState.requests);
if (previousState.messages) setMessages(previousState.messages);
if (currentUser) {
const restoredUser = previousState.users.find((u) => u.id === currentUser.id);
if (restoredUser) {
setCurrentUser(restoredUser);
}
}
setHistoryToast('Action Undone! Restored previous state.');
setTimeout(() => setHistoryToast(''), 3000);
};
const handleRedo = () => {
if (redoStack.length === 0) return;
const nextState = redoStack[0];
setUndoStack((prev) => [...prev, {
users: JSON.parse(JSON.stringify(users)),
students: JSON.parse(JSON.stringify(students)),
requests: JSON.parse(JSON.stringify(requests)),
messages: JSON.parse(JSON.stringify(messages))
}]);
setRedoStack((prev) => prev.slice(1));
setUsers(nextState.users);
setStudents(nextState.students);
setRequests(nextState.requests);
if (nextState.messages) setMessages(nextState.messages);
if (currentUser) {
const restoredUser = nextState.nextUsers?.find((u: any) => u.id === currentUser.id) || nextState.users.find((u) => u.id === currentUser.id);
if (restoredUser) {
setCurrentUser(restoredUser);
}
}
setHistoryToast('Action Redone! Restored latest state.');
setTimeout(() => setHistoryToast(''), 3000);
};
// Global Keyboard Listener for Undo (Ctrl+Z / Cmd+Z) and Redo (Ctrl+Y / Cmd+Shift+Z)
useEffect(() => {
const handleKeyDown = (e: KeyboardEvent) => {
const target = e.target as HTMLElement;
if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
return;
}
if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
if (e.shiftKey) {
e.preventDefault();
handleRedo();
} else {
e.preventDefault();
handleUndo();
}
} else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
e.preventDefault();
handleRedo();
}
};
window.addEventListener('keydown', handleKeyDown);
return () => window.removeEventListener('keydown', handleKeyDown);
}, [undoStack, redoStack, users, students, requests, messages, currentUser]);

const req = requests.find((r) => r.id === requestId);
if (!req) return;
if (!window.confirm(`Permanently delete the access request from "${req.name}"? This cannot be undone except via Undo.`)) return;
pushStateToUndo();
setRequests((prev) => prev.filter((r) => r.id !== requestId));
};
// Permanently deletes a portal account (agent or student). Optionally also removes the
// linked student application record, since a student account with no record left behind
// is rarely what's wanted.
const handleDeleteUserAccount = (userId: string) => {
const u = users.find((x) => x.id === userId);
if (!u) return;
const alsoDeleteRecord =
u.type === 'student' &&
students.some((s) => s.studentEmail.toLowerCase() === u.email.toLowerCase()) &&
window.confirm(
`Delete the account for "${u.name}" (${u.email})?\n\nClick OK to also permanently delete their linked student application record, or Cancel to keep the application record and only remove the login account.`
);
const confirmedPlainDelete =
u.type !== 'student' || !students.some((s) => s.studentEmail.toLowerCase() === u.email.toLowerCase())
? window.confirm(`Permanently delete the account for "${u.name}" (${u.email})? This cannot be undone except via Undo.`)
: true;
if (!confirmedPlainDelete) return;
pushStateToUndo();
setUsers((prev) => prev.filter((x) => x.id !== userId));
if (alsoDeleteRecord) {
setStudents((prev) => prev.filter((s) => s.studentEmail.toLowerCase() !== u.email.toLowerCase()));
}
if (currentUser && currentUser.id === userId) {
setCurrentUser(null);
setActivePortal(null);
}
};
// Permanently deletes a student application record (documents, status, program details) --
// separate from the login account itself, which is deleted independently above.
const handleDeleteStudentRecord = (studentId: string) => {
const s = students.find((x) => x.id === studentId);
if (!s) return;
if (!window.confirm(`Permanently delete the application record for "${s.name}"? This cannot be undone except via Undo.`)) return;
pushStateToUndo();
setStudents((prev) => prev.filter((x) => x.id !== studentId));
};
// Layout controls: reorder or show/hide main page sections. Nav and Footer are fixed and not
// included here since removing either would break navigation entirely.
const handleMoveSectionUp = (id: string) => {
setSectionOrder((prev) => {
const idx = prev.indexOf(id);
if (idx <= 0) return prev;
const next = [...prev];
[next[idx - 1], next[idx]] = [next[idx], next[idx - 1]];
return next;
});
};
const handleMoveSectionDown = (id: string) => {
setSectionOrder((prev) => {
const idx = prev.indexOf(id);
if (idx === -1 || idx >= prev.length - 1) return prev;
const next = [...prev];
[next[idx + 1], next[idx]] = [next[idx], next[idx + 1]];
return next;
});
};
const handleToggleSectionVisibility = (id: string) => {
setHiddenSections((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
};
const handleResetLayout = () => {
setSectionOrder(DEFAULT_SECTION_ORDER);
setHiddenSections([]);
};
const handleUpdateStudentStatus = (studentId: string, status: StudentStatus) => {
pushStateToUndo();
let affectedStudentEmail = 'john.doe@example.com';
let affectedStudentName = 'Student';
setStudents((prev) =>
prev.map((s) => {
if (s.id !== studentId) return s;
affectedStudentEmail = s.studentEmail;
affectedStudentName = s.name;
return { ...s, status };
})
);
triggerEmailAlert(
'status_change',
'Application Status Updated',
affectedStudentEmail,
'NEXTGENZ Admin System',
`[NEXTGENZ Alert] Application Status Changed: "${status.toUpperCase()}" for ${affectedStudentName}`,
`Application status for student ${affectedStudentName} (${affectedStudentEmail}) has been updated to "${status.toUpperCase()}".`
);
};
const handleViewPortalAsUser = (user: PortalUser) => {
setCurrentUser(user);
setActivePortal(user.type);
setIsAdminPreview(true);
};
return (
<div
contentEditable={isAdminActive}
suppressContentEditableWarning
className="font-sans text-gray-800 antialiased bg-[#F5F7FA] overflow-x-hidden min-h-screen"
>
{/* Navigation Bar */}
<HeaderNavbar onOpenPortal={handleOpenPortal} />
{/* Main sections, in admin-configurable order (defaults to the original order below) */}
{sectionOrder
.filter((id) => !hiddenSections.includes(id))
.map((id) => {
switch (id) {
case 'hero':
return <HeroSection key={id} />;
case 'trust':
return <TrustStatsAndMarquee key={id} />;
case 'about':
return <AboutAndWhyMalaysia key={id} />;
case 'services':
return <ServicesAndPortals key={id} onOpenPortal={handleOpenPortal} />;
case 'process':
return <ProcessAndAgents key={id} onRequestAccess={handleRequestAccess} />;
case 'faq':
return <FaqAndContact key={id} onRequestAccess={handleRequestAccess} />;
default:
return null;
}
})}
{/* Footer & Admin Toggle */}
<Footer
onOpenAdmin={() => {
if (isAdminActive) {
handleAdminSignOut();
} else {
setShowAdminAuthModal(true);
}
}}
isAdminActive={isAdminActive}
/>
{/* Floating WhatsApp Widget */}
<a contentEditable={false} suppressContentEditableWarning
href="https://wa.me/60108768308"
target="_blank"
rel="noreferrer"
className="fixed bottom-6 right-6 z-50 flex items-center group cursor-pointer"
aria-label="Chat with us on WhatsApp"
>
<div className="mr-3 bg-white text-[#0F1F38] font-bold text-xs px-3.5 py-2 rounded-xl shadow-lg opacity-0 translate-x-4 group-hover:opacity-100 group-hover:translate-x-0 transition duration-300 pointer-events-none hidden sm:block">
Chat with us!
</div>
<div className="w-14 h-14 bg-[#25D366] text-white rounded-full flex items-center justify-center text-3xl shadow-[0_4px_14px_rgba(37,211,102,0.5)] wa-pulse hover:scale-110 transition-transform">
<i className="fa-brands fa-whatsapp"></i>
</div>
</a>
{/* Live Database Connection Error Banner */}
{firebaseError && (
<div className="fixed top-0 left-0 w-full bg-red-700 text-white text-center py-2 z-[100001] font-semibold text-xs sm:text-sm shadow-lg">
<i className="fa-solid fa-triangle-exclamation mr-1"></i> {firebaseError}
</div>
)}
{/* Floating Undo/Redo History Bar */}
{(undoStack.length > 0 || redoStack.length > 0 || isAdminActive) && (
<div className="fixed bottom-6 left-6 z-50 bg-[#0F1F38]/95 backdrop-blur-md text-white px-4 py-2.5 rounded-2xl border border-[#C5A059]/50 shadow-2xl flex items-center gap-3">
<div className="text-xs font-bold text-[#C5A059] uppercase tracking-wider flex items-center gap-1.5 border-r border-gray-700 pr-3">
<i className="fa-solid fa-clock-rotate-left text-sm"></i> History
</div>
<button contentEditable={false} suppressContentEditableWarning
onClick={handleUndo}
disabled={undoStack.length === 0}
className={`px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition ${
undoStack.length > 0
? 'bg-[#C5A059] text-[#0F1F38] hover:bg-[#D4AF37] cursor-pointer shadow-sm'
: 'bg-gray-800 text-gray-500 cursor-not-allowed opacity-50'
}`}
title="Undo last change (Ctrl+Z)"
>
<i className="fa-solid fa-rotate-left"></i> Undo ({undoStack.length})
</button>
<button contentEditable={false} suppressContentEditableWarning
onClick={handleRedo}
disabled={redoStack.length === 0}
className={`px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition ${
redoStack.length > 0
? 'bg-[#C5A059] text-[#0F1F38] hover:bg-[#D4AF37] cursor-pointer shadow-sm'
: 'bg-gray-800 text-gray-500 cursor-not-allowed opacity-50'
}`}
title="Redo change (Ctrl+Y / Cmd+Shift+Z)"
>
<i className="fa-solid fa-rotate-right"></i> Redo ({redoStack.length})
</button>
</div>
)}
{/* History Toast Notification */}
{historyToast && (
<div className="fixed top-16 left-1/2 transform -translate-x-1/2 z-[100000] bg-[#0F1F38] text-white px-6 py-3 rounded-full shadow-2xl border border-[#C5A059] flex items-center gap-3 text-sm font-bold animate-pulse">
<i className="fa-solid fa-[#C5A059] fa-rotate-left text-[#C5A059] text-lg"></i>
{historyToast}
</div>
)}
{/* Student / Agent Portal Overlays & Login Modal */}
<PortalOverlays
activePortal={activePortal}
currentUser={currentUser}
users={users}
students={students}
messages={messages}
isAdminActive={isAdminActive}
isAdminPreview={isAdminPreview}
onClosePortal={handleClosePortal}
onLoginSubmit={handleLoginSubmit}
onRequestAccess={handleRequestAccess}
onAddStudent={handleAddStudent}
onUpdateDocumentLink={handleUpdateDocumentLink}
onOpenStudentByEmail={handleOpenStudentByEmail}
onSendMessage={handleSendMessage}
onDeleteMessage={handleDeleteMessage}
onUndo={handleUndo}
onRedo={handleRedo}
canUndo={undoStack.length > 0}
canRedo={redoStack.length > 0}
onFullEditStudentAccount={handleFullEditStudentAccount}
onViewPortalAsUser={handleViewPortalAsUser}
onUpdateStudentField={handleUpdateStudentField}
onUpdateStudentStatus={handleUpdateStudentStatus}
onOpenEmailAlerts={() => setShowEmailAlertsModal(true)}
emailAlertCount={emailAlerts.length}
onProgramInterest={handleProgramInterest}
/>
{/* Admin Mode Overlays & Registration Management */}
<AdminOverlays
isAdminActive={isAdminActive}
showAuthModal={showAdminAuthModal}
onCloseAuthModal={() => setShowAdminAuthModal(false)}
onAuthenticateAdmin={handleAuthenticateAdmin}
onExitAdmin={handleAdminSignOut}
onSaveChanges={() => {
const ts = new Date().toISOString();
localStorage.setItem('nextgenz_site_published', ts);
firebase.database().ref('site_content/lastPublished').set(ts).catch((err: any) => console.error('Failed to record publish time:', err));
}}
requests={requests}
users={users}
students={students}
messages={messages}
onApproveRequest={handleApproveRequest}
onRejectRequest={handleRejectRequest}
onDeleteRequest={handleDeleteRequest}
onDeleteUserAccount={handleDeleteUserAccount}
onDeleteStudentRecord={handleDeleteStudentRecord}
sectionOrder={sectionOrder}
hiddenSections={hiddenSections}
onMoveSectionUp={handleMoveSectionUp}
onMoveSectionDown={handleMoveSectionDown}
onToggleSectionVisibility={handleToggleSectionVisibility}
onResetLayout={handleResetLayout}
onUpdateStudentStatus={handleUpdateStudentStatus}
onUpdateDocumentLink={handleUpdateDocumentLink}
onViewPortalAsUser={handleViewPortalAsUser}
onUpdateUserName={handleUpdateUserName}
onOpenStudentByEmail={handleOpenStudentByEmail}
onFullEditStudentAccount={handleFullEditStudentAccount}
onSendMessage={handleSendMessage}
onDeleteMessage={handleDeleteMessage}
onUndo={handleUndo}
onRedo={handleRedo}
canUndo={undoStack.length > 0}
canRedo={redoStack.length > 0}
onOpenEmailAlerts={() => setShowEmailAlertsModal(true)}
emailAlertCount={emailAlerts.length}
onProgramInterest={handleProgramInterest}
/>
{/* Real-time Email Alerts & Dispatcher Modal */}
<EmailAlertsModal
isOpen={showEmailAlertsModal}
onClose={() => setShowEmailAlertsModal(false)}
emailAlerts={emailAlerts}
activeToast={activeToast}
onCloseToast={() => setActiveToast(null)}
onSendTestTrigger={handleSendTestTrigger}
onClearAlerts={() => setEmailAlerts([])}
isAdminActive={isAdminActive}
/>
</div>
);
}

// ==== bootstrap ====
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>

<script>
window.addEventListener('load', function() {
  try {
    if (!window.React || !window.ReactDOM || !window.Babel) {
      throw new Error('One or more required libraries (React, ReactDOM, Babel) failed to load from the CDN. Check your internet connection and try reloading the page.');
    }
    var React = window.React;
    var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef,
        useMemo = React.useMemo, useCallback = React.useCallback, useContext = React.useContext,
        Fragment = React.Fragment;
    var source = document.getElementById('app-source').textContent;
    var output = Babel.transform(source, {
      presets: [["typescript", { isTSX: true, allExtensions: true }], "react"],
      filename: 'app.tsx'
    }).code;
    var fn = new Function('React', 'useState', 'useEffect', 'useRef', 'useMemo', 'useCallback', 'useContext', 'Fragment', 'ReactDOM', output);
    fn(React, useState, useEffect, useRef, useMemo, useCallback, useContext, Fragment, window.ReactDOM);
  } catch (err) {
    console.error(err);
    var root = document.getElementById('root');
    if (root) {
      root.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;margin:40px;">' +
        '<strong>Failed to load the app.</strong><br>' + (err && err.message ? err.message : String(err)) +
        '<br><br>Try reloading the page, or check your internet connection (this page loads React, Babel and Tailwind from a CDN).</div>';
    }
  }
});
</script>
</body>
    </html>
