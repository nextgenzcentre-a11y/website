<!-- Static Google Translate Target Element -->
<div id="google_translate_element" style="position: absolute; left: -9999px; top: -9999px; opacity: 0; pointer-events: none;"></div>
<script>
// Google Translate periodically changes its injected markup (class names, floating icons,
// tooltips) which lets it slip past static CSS hiding rules. This actively watches the whole
// document and instantly hides/removes anything Google Translate injects outside of our own
// intentionally-visible language dropdown (.goog-te-combo), so no stray icon/banner can ever
// appear no matter what markup Google uses.
(function () {
function isGoogleTranslateNoise(el) {
if (!(el instanceof Element)) return false;
if (el.classList && el.classList.contains('goog-te-combo')) return false; // keep our own select
const id = el.id || '';
const cls = el.className && el.className.toString ? el.className.toString() : '';
if (el.tagName === 'IFRAME' && (id.startsWith(':') || /translate/i.test(el.src || ''))) return true;
if (id.startsWith('goog-gt-') || id.startsWith(':')) return true;
if (/goog-te-banner|goog-te-balloon|goog-te-gadget-icon|goog-tooltip|VIpgJd-/.test(cls)) return true;
if (/^skiptranslate$/.test(cls) && el.tagName !== 'BODY') return true;
return false;
}
function sweep(root) {
if (!root || !root.querySelectorAll) return;
root.querySelectorAll('iframe, div, span').forEach((el) => {
if (isGoogleTranslateNoise(el)) {
el.style.setProperty('display', 'none', 'important');
el.style.setProperty('visibility', 'hidden', 'important');
el.style.setProperty('height', '0', 'important');
el.style.setProperty('width', '0', 'important');
el.style.setProperty('pointer-events', 'none', 'important');
}
});
document.documentElement.style.setProperty('top', '0px', 'important');
document.body.style.setProperty('top', '0px', 'important');
}
const observer = new MutationObserver((mutations) => {
mutations.forEach((m) => {
m.addedNodes.forEach((node) => {
if (node.nodeType === 1) {
if (isGoogleTranslateNoise(node)) {
node.style.setProperty('display', 'none', 'important');
}
sweep(node);
}
});
});
sweep(document.body);
});
document.addEventListener('DOMContentLoaded', () => {
sweep(document.body);
observer.observe(document.body, { childList: true, subtree: true });
});
// Also sweep periodically as a safety net for the first few seconds after load,
// since Google Translate's own script can inject its UI asynchronously.
let sweeps = 0;
const interval = setInterval(() => {
sweep(document.body);
sweeps++;
if (sweeps > 40) clearInterval(interval);
}, 250);
})();
</script>

// Builds a clean, professional, labeled email body that always ends in a signature block,
// so every notification (chat, status change, new registration, agent application...) looks consistent.
function formatEmailBody(opts: {
heading: string;
intro?: string;
lines: { label: string; value?: string }[];
note?: string;
}): string {
const cleanLines = opts.lines.filter(
(l) => l.value !== undefined && l.value !== null && String(l.value).trim() !== ''
);
const maxLabelLen = cleanLines.reduce((max, l) => Math.max(max, l.label.length), 0);
const rows = cleanLines.map((l) => `${l.label.padEnd(maxLabelLen, ' ')} : ${l.value}`).join('\n');
const timestamp = new Date().toLocaleString('en-US', {
year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
});
const parts = [
opts.heading,
'============================================',
'',
opts.intro || '',
'',
rows,
'',
opts.note || '',
'',
`Date: ${timestamp}`,
'',
'--',
'Kind regards,',
'Admission Officer',
'NEXTGENZ CENTRE - Admissions Department',
'admission@nextgenzcentre.space | wa.me/60108768308'
];
const cleaned: string[] = [];
for (let i = 0; i < parts.length; i++) {
if (parts[i] === '' && cleaned[cleaned.length - 1] === '') continue;
cleaned.push(parts[i]);
}
return cleaned.join('\n');
}

type EmailTriggerType = 'chat' | 'document' | 'status_change' | 'access_request' | 'account_update' | 'agent_application' | 'new_student' | 'broadcast';

// Sends one email via EmailJS, logs it to localStorage, and broadcasts a DOM event so any
// mounted component (including the Admin Email Dispatch Logs panel) picks it up live -
// this means components that don't receive triggerEmailAlert as a prop (like the public
// "Become an Agent" and "Free Advisory" forms) can still notify Admin directly.
function dispatchAppEmail(params: {
to: string;
subject: string;
body: string;
triggerType: EmailTriggerType;
title: string;
senderName: string;
}) {
const { to, subject, body, triggerType, title, senderName } = params;
const formattedDate = new Date().toLocaleString('en-US', {
year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
});
const mailtoUrl = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
const alertLog = {
id: `alert-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
triggerType,
title,
adminEmail: ADMIN_EMAIL,
studentEmail: to,
senderName,
subject,
body,
timestamp: formattedDate,
status: 'sending',
mailtoUrl
};
try {
const saved = localStorage.getItem('nextgenz_email_alerts');
const list = saved ? JSON.parse(saved) : [];
list.unshift(alertLog);
localStorage.setItem('nextgenz_email_alerts', JSON.stringify(list));
} catch (e) { /* ignore storage errors */ }
window.dispatchEvent(new CustomEvent('nextgenz-email-alert', { detail: alertLog }));

(async () => {
let finalStatus = 'sent';
try {
await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
to_email: to,
subject,
message: body,
from_name: 'NEXTGENZ CENTRE Admissions',
reply_to: 'admission@nextgenzcentre.space',
sender_name: senderName
}, EMAILJS_PUBLIC_KEY);
finalStatus = 'delivered';
} catch (err) {
console.warn('EmailJS dispatch note:', err);
finalStatus = 'sent';
}
try {
const saved = localStorage.getItem('nextgenz_email_alerts');
const list = saved ? JSON.parse(saved) : [];
const updated = list.map((item: any) => (item.id === alertLog.id ? { ...item, status: finalStatus } : item));
localStorage.setItem('nextgenz_email_alerts', JSON.stringify(updated));
} catch (e) { /* ignore storage errors */ }
window.dispatchEvent(new CustomEvent('nextgenz-email-alert-update', { detail: { id: alertLog.id, status: finalStatus } }));
})();

return alertLog;
}

// Sends the same formatted email to several recipients at once (dedupes + skips blanks) -
// this is how one status change reaches Admin, the Agent, and the Student in one call.
function dispatchAppEmailToMany(params: {
recipients: (string | undefined | null)[];
subject: string;
body: string;
triggerType: EmailTriggerType;
title: string;
senderName: string;
}) {
const unique = Array.from(new Set(params.recipients.filter((r): r is string => !!r && r.includes('@'))));
unique.forEach((to) => dispatchAppEmail({ ...params, to }));
return unique;
}

// Generates a random, readable temporary password (e.g. "Nx7kLp2q") for new portal accounts
function generateSecurePassword(): string {
const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
let pwd = '';
for (let i = 0; i < 10; i++) pwd += chars[Math.floor(Math.random() * chars.length)];
return pwd;
}

// Converts a Google Drive share link, "open?id=" link, or a bare Drive File ID into a
// directly-embeddable image URL. Any other URL (Unsplash, phototourl CDN, etc.) passes through unchanged.
function resolveImageUrl(input: string): string {
const trimmed = (input || '').trim();
if (!trimmed) return trimmed;
if (/^https?:\/\/lh3\.googleusercontent\.com\/d\//.test(trimmed)) return trimmed;
let match = trimmed.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
if (match) return `https://lh3.googleusercontent.com/d/${match[1]}`;
match = trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
if (match) return `https://lh3.googleusercontent.com/d/${match[1]}`;
match = trimmed.match(/drive\.usercontent\.google\.com\/download\?id=([a-zA-Z0-9_-]+)/);
if (match) return `https://lh3.googleusercontent.com/d/${match[1]}`;
if (/^[a-zA-Z0-9_-]{15,100}$/.test(trimmed) && !trimmed.startsWith('http')) {
return `https://lh3.googleusercontent.com/d/${trimmed}`;
}
return trimmed;
}

// cache that every visitor reads from, and any admin write is pushed to Firebase immediately
// so the change appears for everyone, on every browser and device, right away - not just in
// the browser that made the change.

function saveImageOverrides(map: Record<string, string>) {

// Every EditableImage/EditableBackgroundImage/EditableProfilePhoto instance calls this once to
// stay in sync with live Firebase updates (e.g. admin changes a photo in another tab/browser).
function useImageOverrides(id: string, fallback: string): [string, boolean] {
const [value, setValue] = useState(() => readImageOverrides()[id] || fallback);
const [hasOverride, setHasOverride] = useState(() => !!readImageOverrides()[id]);
useEffect(() => {
const handler = (e: any) => {
const map = e.detail || {};
setValue(map[id] || fallback);
setHasOverride(!!map[id]);
};
window.addEventListener('nextgenz-image-overrides', handler);
const already = readImageOverrides()[id];
if (already) {
setValue(already);
setHasOverride(true);
}
return () => window.removeEventListener('nextgenz-image-overrides', handler);
}, [id, fallback]);
return [value, hasOverride];
}

interface LanguageOption {
code: string;
name: string;
nativeName: string;
flag: string;
}
const LANGUAGES: LanguageOption[] = [
{ code: 'en', name: 'English', nativeName: 'English', flag: '🇬🇧' },
{ code: 'ar', name: 'Arabic', nativeName: 'ﺍﻟﻌﺮﺑﻴﺔ', flag: '🇸🇦' },
{ code: 'fr', name: 'French', nativeName: 'Français', flag: '🇫🇷' },
{ code: 'es', name: 'Spanish', nativeName: 'Español', flag: '🇪🇸' },
{ code: 'ms', name: 'Malay', nativeName: 'Bahasa Melayu', flag: '🇲🇾' },
{ code: 'zh-CN', name: 'Chinese', nativeName: '中文 (简体)', flag: '🇨🇳' },
{ code: 'ru', name: 'Russian', nativeName: 'Русский', flag: '🇷🇺' },
{ code: 'tr', name: 'Turkish', nativeName: 'Türkçe', flag: '🇹🇷' },
{ code: 'id', name: 'Indonesian', nativeName: 'Bahasa Indonesia', flag: '🇮🇩' }
];
const LanguageSelector: React.FC = () => {
const [isOpen, setIsOpen] = useState(false);
const [currentLang, setCurrentLang] = useState<LanguageOption>(LANGUAGES[0]);
const dropdownRef = useRef<HTMLDivElement>(null);
// Close dropdown on click outside
useEffect(() => {
const handleClickOutside = (event: MouseEvent) => {
if (dropdownRef.current && !dropdownRef.current.contains(event.target as Node)) {
setIsOpen(false);
}
};
document.addEventListener('mousedown', handleClickOutside);
return () => document.removeEventListener('mousedown', handleClickOutside);
}, []);
// Initialize google translate on mount if element exists
useEffect(() => {
if (typeof (window as any).googleTranslateElementInit === 'function') {
try {
(window as any).googleTranslateElementInit();
} catch (err) {
console.warn('Google Translate mount trigger:', err);
}
}
}, []);
// Detect current language from google cookie on load
useEffect(() => {
const cookies = document.cookie.split(';');
const googCookie = cookies.find((c) => c.trim().startsWith('googtrans='));
if (googCookie) {
const val = googCookie.split('=')[1];
if (val) {
const parts = val.split('/');
const langCode = parts[parts.length - 1];
const match = LANGUAGES.find((l) => l.code.toLowerCase() === langCode.toLowerCase());
if (match) {
setCurrentLang(match);
if (match.code === 'ar') {
document.documentElement.setAttribute('dir', 'rtl');
}
}
}
}
}, []);
const changeLanguage = (lang: LanguageOption) => {
setCurrentLang(lang);
setIsOpen(false);
// RTL handling for Arabic
if (lang.code === 'ar') {
document.documentElement.setAttribute('dir', 'rtl');
} else {
document.documentElement.setAttribute('dir', 'ltr');
}
const domain = window.location.hostname;
if (lang.code === 'en') {
// Clear cookie for English
document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
if (domain) {
document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=${domain}`;
}
} else {
// Set cookie for Google Translate across all path variations
document.cookie = `googtrans=/auto/${lang.code}; path=/;`;
document.cookie = `googtrans=/en/${lang.code}; path=/;`;
if (domain) {
document.cookie = `googtrans=/auto/${lang.code}; path=/; domain=${domain}`;
document.cookie = `googtrans=/en/${lang.code}; path=/; domain=${domain}`;
}
}
// Attempt to trigger select element directly if loaded
const triggerTranslate = () => {
const selectElem = document.querySelector('.goog-te-combo') as HTMLSelectElement;
if (selectElem) {
selectElem.value = lang.code;
selectElem.dispatchEvent(new Event('change'));
return true;
}
return false;
};
if (!triggerTranslate()) {
// Retry after short delay or reload to apply cookies
setTimeout(() => {
if (!triggerTranslate()) {
window.location.reload();
}
}, 300);
}
};

// viewer is allowed to change it. Used for University/Program/Country/Study Level, which the
// student or agent can adjust themselves only up until an offer is received - after that, or for
// anyone else, it renders as a plain read-only value.
const EditableSelectField: React.FC<{
label: string;
value: string;
options: string[];
otherLabel: string;
canEdit: boolean;
lockedMessage?: string;
onSave: (newValue: string) => void;
valueClassName?: string;
}> = ({ label, value, options, otherLabel, canEdit, lockedMessage, onSave, valueClassName }) => {
const [editing, setEditing] = useState(false);
const isCurrentlyOther = !!value && !options.includes(value);
const [selectVal, setSelectVal] = useState(isCurrentlyOther ? otherLabel : value);
const [otherVal, setOtherVal] = useState(isCurrentlyOther ? value : '');
if (!canEdit) {
return (
<div>
{label && <p className="text-xs text-gray-400 font-bold uppercase mb-1">{label}</p>}
<p className={valueClassName || 'font-bold text-md text-[#0F1F38]'}>{value || 'N/A'}</p>
{lockedMessage && (
<p className="text-[10px] text-gray-400 mt-0.5">
<i className="fa-solid fa-lock mr-1"></i>{lockedMessage}
</p>
)}
</div>
);
}
if (!editing) {
return (
<div>
{label && <p className="text-xs text-gray-400 font-bold uppercase mb-1">{label}</p>}
<div className="flex items-center gap-2 flex-wrap">
<p className={valueClassName || 'font-bold text-md text-[#0F1F38]'}>{value || 'Not set'}</p>
<button
contentEditable={false}
suppressContentEditableWarning
onClick={() => {
setSelectVal(isCurrentlyOther ? otherLabel : value);
setOtherVal(isCurrentlyOther ? value : '');
setEditing(true);
}}
className="text-[#C5A059] hover:text-[#0F1F38] text-xs cursor-pointer"
title={`Edit ${label}`}
>
<i className="fa-solid fa-pen"></i>
</button>
</div>
</div>
);
}
return (
<div className="p-3 bg-amber-50 border border-amber-200 rounded-xl">
<p className="text-xs font-bold text-amber-900 uppercase mb-1.5">{label}</p>
<select
contentEditable={false}
suppressContentEditableWarning
value={selectVal}
onChange={(e) => setSelectVal(e.target.value)}
className="w-full px-2.5 py-1.5 rounded-lg border border-amber-300 text-sm mb-2 bg-white"
>
{options.map((o) => (
<option key={o} value={o}>
{o}
</option>
))}
</select>
{selectVal === otherLabel && (
<input
contentEditable={false}
suppressContentEditableWarning
type="text"
value={otherVal}
onChange={(e) => setOtherVal(e.target.value)}
placeholder="Please specify..."
className="w-full px-2.5 py-1.5 rounded-lg border border-amber-300 text-sm mb-2"
/>
)}
<div className="flex gap-2">
<button
contentEditable={false}
suppressContentEditableWarning
onClick={() => {
const finalVal = selectVal === otherLabel ? otherVal.trim() : selectVal;
if (!finalVal) return;
onSave(finalVal);
setEditing(false);
}}
className="px-3 py-1 bg-[#0F1F38] text-white text-xs font-bold rounded-lg cursor-pointer"
>
Save
</button>
<button
contentEditable={false}
suppressContentEditableWarning
onClick={() => setEditing(false)}
className="px-3 py-1 bg-gray-200 text-gray-600 text-xs font-bold rounded-lg cursor-pointer"
>
Cancel
</button>
</div>
</div>
);
};

function App() {
// Live Firebase-backed states (replaces old localStorage persistence).
// Each collection loads from Firebase Realtime Database on mount, stays in sync via
// a live listener, and writes back any local change once the initial load has completed.
const [users, setUsers] = useState<PortalUser[]>(INITIAL_USERS);
const [students, setStudents] = useState<StudentRecord[]>(INITIAL_STUDENTS);
const [requests, setRequests] = useState<AccessRequest[]>(INITIAL_REQUESTS);
const [messages, setMessages] = useState<ChatMessage[]>(INITIAL_MESSAGES);
// Admin-adjustable page layout: which sections show, and in what order.
const [sectionOrder, setSectionOrder] = useState<string[]>(DEFAULT_SECTION_ORDER);
const [hiddenSections, setHiddenSections] = useState<string[]>([]);
const layoutLoadedRef = useRef(false);
// Guards so the initial snapshot pulled FROM Firebase doesn't immediately get written back,
// and so local default state isn't pushed up before the real data has had a chance to load.
const usersLoadedRef = useRef(false);
const studentsLoadedRef = useRef(false);
const requestsLoadedRef = useRef(false);
const messagesLoadedRef = useRef(false);
const [firebaseReady, setFirebaseReady] = useState(false);
const [firebaseError, setFirebaseError] = useState('');
// Current authenticated Firebase admin user (null = not logged in as admin)
const [adminAuthUser, setAdminAuthUser] = useState<any>(null);
useEffect(() => {
const collections: [string, React.Dispatch<React.SetStateAction<any>>, any, React.MutableRefObject<boolean>][] = [
['users', setUsers, INITIAL_USERS, usersLoadedRef],
['students', setStudents, INITIAL_STUDENTS, studentsLoadedRef],
['requests', setRequests, INITIAL_REQUESTS, requestsLoadedRef],
['messages', setMessages, INITIAL_MESSAGES, messagesLoadedRef]
];
const refs: any[] = [];
let cancelled = false;
collections.forEach(([path, setter, seed, loadedRef]) => {
const dbRef = firebase.database().ref(path);
refs.push(dbRef);
dbRef.on(
'value',
(snapshot: any) => {
if (cancelled) return;
const val = snapshot.val();
loadedRef.current = true;
if (val !== null && val !== undefined) {
setter(val);
} else {
// First-ever run against a fresh database: seed it with the demo/starter data.
dbRef.set(seed);
setter(seed);
}
setFirebaseReady(true);
},
(err: any) => {
console.error('Firebase read error on "' + path + '":', err);
setFirebaseError(
'Could not connect to the live database (' + (err && err.message ? err.message : 'unknown error') + '). Changes will not be saved until this is resolved.'
);
}
);
});
return () => {
cancelled = true;
refs.forEach((r) => r.off());
};
}, []);
// Track real Firebase Auth session; only a signed-in admin account can activate Admin Mode.
useEffect(() => {
const unsubscribe = firebase.auth().onAuthStateChanged((user: any) => {
setAdminAuthUser(user);
setIsAdminActive(!!user);
});
return () => unsubscribe();
}, []);
// Load the saved layout (section order + hidden sections) and keep it live-synced.
useEffect(() => {
const dbRef = firebase.database().ref('site_content/layout');
const listener = dbRef.on(
'value',
(snapshot: any) => {
const val = snapshot.val();
layoutLoadedRef.current = true;
if (val) {
setSectionOrder(val.order && val.order.length ? val.order : DEFAULT_SECTION_ORDER);
setHiddenSections(val.hidden || []);
}
},
(err: any) => console.error('Firebase read error on "site_content/layout":', err)
);
return () => dbRef.off('value', listener);
}, []);
useEffect(() => {
if (!layoutLoadedRef.current) return;
firebase
.database()
.ref('site_content/layout')
.set({ order: sectionOrder, hidden: hiddenSections })
.catch((err: any) => console.error('Failed to save layout:', err));
}, [sectionOrder, hiddenSections]);
const [emailAlerts, setEmailAlerts] = useState<EmailAlertLog[]>(() => {
const saved = localStorage.getItem('nextgenz_email_alerts');
return saved ? JSON.parse(saved) : INITIAL_EMAIL_ALERTS;
});
const [activeToast, setActiveToast] = useState<EmailAlertLog | null>(null);
const [showEmailAlertsModal, setShowEmailAlertsModal] = useState<boolean>(false);
useEffect(() => {
localStorage.setItem('nextgenz_email_alerts', JSON.stringify(emailAlerts));
}, [emailAlerts]);
// Listen for emails dispatched from components outside App's own state (e.g. the public
// "Become an Agent" and "Free Advisory" forms), so the Email Dispatch Logs panel and the
// live toast stay accurate no matter which part of the app sent the email.
useEffect(() => {
const onNewAlert = (e: any) => {
const alertLog: EmailAlertLog = e.detail;
setEmailAlerts((prev) => (prev.some((a) => a.id === alertLog.id) ? prev : [alertLog, ...prev]));
setActiveToast(alertLog);
};
const onUpdateAlert = (e: any) => {
const { id, status } = e.detail;
setEmailAlerts((prev) => prev.map((item) => (item.id === id ? { ...item, status } : item)));
};
window.addEventListener('nextgenz-email-alert', onNewAlert);
window.addEventListener('nextgenz-email-alert-update', onUpdateAlert);
return () => {
window.removeEventListener('nextgenz-email-alert', onNewAlert);
window.removeEventListener('nextgenz-email-alert-update', onUpdateAlert);

}, []);
// Backward-compatible wrapper around dispatchAppEmailToMany - sends the formatted, signed

) => {

// Undo / Redo History States
const [undoStack, setUndoStack] = useState<{ users: PortalUser[]; students: StudentRecord[]; requests: AccessRequest[]; messages: ChatMessage[] }[]>([]);
const [redoStack, setRedoStack] = useState<{ users: PortalUser[]; students: StudentRecord[]; requests: AccessRequest[]; messages: ChatMessage[] }[]>([]);
const [historyToast, setHistoryToast] = useState('');
// Portal & User states
const [activePortal, setActivePortal] = useState<'student' | 'agent' | null>(null);
const [currentUser, setCurrentUser] = useState<PortalUser | null>(null);
// Admin states
const [isAdminActive, setIsAdminActive] = useState(false);
// True only when Admin clicked "View as Student/Agent" from the Admin panel - distinguishes
// admin previewing a portal from a real student/agent logging in with their own credentials.
const [isAdminPreview, setIsAdminPreview] = useState(false);
// Keep the module-level admin flag + EditableImage components in sync with admin mode
useEffect(() => {
__adminModeActive = isAdminActive;
window.dispatchEvent(new CustomEvent('nextgenz-admin-mode', { detail: isAdminActive }));
}, [isAdminActive]);
const [showAdminAuthModal, setShowAdminAuthModal] = useState(false);
// Sync state changes back up to Firebase (skipped until each collection's initial load
// has completed, so we never clobber live data with the local default/starter arrays).
useEffect(() => {
if (!usersLoadedRef.current) return;
firebase.database().ref('users').set(users).catch((err: any) => console.error('Failed to save users:', err));
}, [users]);
useEffect(() => {
if (!studentsLoadedRef.current) return;
firebase.database().ref('students').set(students).catch((err: any) => console.error('Failed to save students:', err));
}, [students]);
useEffect(() => {
if (!requestsLoadedRef.current) return;
firebase.database().ref('requests').set(requests).catch((err: any) => console.error('Failed to save requests:', err));
}, [requests]);
useEffect(() => {
if (!messagesLoadedRef.current) return;
firebase.database().ref('messages').set(messages).catch((err: any) => console.error('Failed to save messages:', err));
}, [messages]);
// Keep active logged-in session user details automatically synchronized with updated users list
useEffect(() => {
if (currentUser) {
const updatedUser = users.find((u) => u.id === currentUser.id);
if (updatedUser) {
if (
updatedUser.email !== currentUser.email ||
updatedUser.name !== currentUser.name ||
updatedUser.username !== currentUser.username ||
updatedUser.phone !== currentUser.phone ||
updatedUser.password !== currentUser.password
) {
setCurrentUser(updatedUser);
}
}
}
}, [users, currentUser]);
// Helper to snapshot current state before mutations for UNDO
const pushStateToUndo = () => {
setUndoStack((prev) => [...prev, {
users: JSON.parse(JSON.stringify(users)),
students: JSON.parse(JSON.stringify(students)),
requests: JSON.parse(JSON.stringify(requests)),
messages: JSON.parse(JSON.stringify(messages))
}]);
setRedoStack([]); // Clear redo on new action
};
const handleUndo = () => {
if (undoStack.length === 0) return;
const previousState = undoStack[undoStack.length - 1];
setRedoStack((prev) => [{
users: JSON.parse(JSON.stringify(users)),
students: JSON.parse(JSON.stringify(students)),
requests: JSON.parse(JSON.stringify(requests)),
messages: JSON.parse(JSON.stringify(messages))
}, ...prev]);
setUndoStack((prev) => prev.slice(0, prev.length - 1));
setUsers(previousState.users);
setStudents(previousState.students);
setRequests(previousState.requests);
if (previousState.messages) setMessages(previousState.messages);
if (currentUser) {
const restoredUser = previousState.users.find((u) => u.id === currentUser.id);
if (restoredUser) {
setCurrentUser(restoredUser);
}
}
setHistoryToast('Action Undone! Restored previous state.');
setTimeout(() => setHistoryToast(''), 3000);
};
const handleRedo = () => {
if (redoStack.length === 0) return;
const nextState = redoStack[0];
setUndoStack((prev) => [...prev, {
users: JSON.parse(JSON.stringify(users)),
students: JSON.parse(JSON.stringify(students)),
requests: JSON.parse(JSON.stringify(requests)),
messages: JSON.parse(JSON.stringify(messages))
}]);
setRedoStack((prev) => prev.slice(1));
setUsers(nextState.users);
setStudents(nextState.students);
setRequests(nextState.requests);
if (nextState.messages) setMessages(nextState.messages);
if (currentUser) {
const restoredUser = nextState.nextUsers?.find((u: any) => u.id === currentUser.id) || nextState.users.find((u) => u.id === currentUser.id);
if (restoredUser) {
setCurrentUser(restoredUser);
}
}
setHistoryToast('Action Redone! Restored latest state.');
setTimeout(() => setHistoryToast(''), 3000);
};
// Global Keyboard Listener for Undo (Ctrl+Z / Cmd+Z) and Redo (Ctrl+Y / Cmd+Shift+Z)
useEffect(() => {
const handleKeyDown = (e: KeyboardEvent) => {
const target = e.target as HTMLElement;
if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
return;
}
if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
if (e.shiftKey) {
e.preventDefault();
handleRedo();
} else {
e.preventDefault();
handleUndo();
}
} else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
e.preventDefault();
handleRedo();
}
};
window.addEventListener('keydown', handleKeyDown);
return () => window.removeEventListener('keydown', handleKeyDown);
}, [undoStack, redoStack, users, students, requests, messages, currentUser]);
const handleSendMessage = (newMsg: Omit<ChatMessage, 'id' | 'timestamp'>) => {

const formattedDate = new Date().toLocaleString('en-US', {

);

// Keyboard shortcut listener for Ctrl+Z and Ctrl+Y / Cmd+Shift+Z
useEffect(() => {
const handleKeyDown = (e: KeyboardEvent) => {
if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
if (e.shiftKey) {
e.preventDefault();
handleRedo();
} else {
e.preventDefault();
handleUndo();
}

e.preventDefault();
handleRedo();

};
window.addEventListener('keydown', handleKeyDown);

],
note: existingUser
? 'This student already had a portal account, so their existing login was reused.'
: 'The student can log in to the Student Portal immediately with the username and temporary password above. We recommend they change it after first login.'
});
dispatchAppEmailToMany({
recipients: [ADMIN_EMAIL, agentEmail, newStudentData.studentEmail],
subject: `[NEXTGENZ] Student Registered: ${newStudentData.name} (ID: ${newStd.id})`,
body,
triggerType: 'new_student',
title: 'New Student File Registered',
senderName: currentUser?.name || 'Agent'
});
};
// Switch view to student portal by student email
const handleOpenStudentByEmail = (studentEmail: string) => {
let foundUser = users.find((u) => u.email.toLowerCase() === studentEmail.toLowerCase());
if (!foundUser) {
const student = students.find((s) => s.studentEmail.toLowerCase() === studentEmail.toLowerCase());
const genUsername = (student?.name.replace(/[^a-zA-Z]/g, '').toLowerCase().slice(0, 8) || 'std') + Math.floor(100 + Math.random() * 900);
foundUser = {
id: 'usr-' + Date.now(),
type: 'student',
username: genUsername,
password: 'password123',
name: student ? student.name : 'Student',
email: studentEmail,
phone: '+60 10-000 0000',
status: 'active',
createdAt: new Date().toISOString()
};
setUsers((prev) => [...prev, foundUser!]);
}
setCurrentUser(foundUser);
setActivePortal('student');
setIsAdminPreview(true);
};
// Document link update handler
const handleUpdateDocumentLink = (studentId: string, docKey: string, docLabel: string, link: string) => {
pushStateToUndo();
let targetEmail = 'john.doe@example.com';
let targetStudentName = 'Student';
setStudents((prev) =>
prev.map((s) => {
if (s.id !== studentId) return s;
targetEmail = s.studentEmail;
targetStudentName = s.name;
const docs = s.documents || {};
docs[docKey] = {
key: docKey,
label: docLabel,
link: link,
updatedAt: new Date().toISOString(),
updatedBy: currentUser?.name || 'admin'
};
return { ...s, documents: docs };
})
);
triggerEmailAlert(
'document',
'Document Link Uploaded / Updated',
targetEmail,
currentUser?.name || 'NEXTGENZ Admin',
`[NEXTGENZ Alert] Document Link Updated: ${docLabel} for ${targetStudentName}`,
`Document "${docLabel}" was updated/uploaded for student ${targetStudentName} (${targetEmail}). Link: ${link}`
);
};
// Update an editable application detail (University / Program / Country / Study Level) - usable
// by the admin (always) or by the student/agent themselves (only before an offer is received).
const handleUpdateStudentField = (
studentId: string,
field: 'university' | 'program' | 'country' | 'studyLevel',
newValue: string,
editorLabel: string
) => {
pushStateToUndo();
let targetEmail = '';
let targetName = '';
let agentEmail: string | undefined;
let oldValue = '';
setStudents((prev) =>
prev.map((s) => {
if (s.id !== studentId) return s;
targetEmail = s.studentEmail;
targetName = s.name;
oldValue = (s as any)[field];
agentEmail = users.find((u) => u.type === 'agent' && u.username === s.agentUsername)?.email;
return { ...s, [field]: newValue };
})
);
const fieldLabels: Record<string, string> = {
university: 'Target University',
program: 'Program / Major',
country: 'Country of Origin',
studyLevel: 'Study Level'
};
const body = formatEmailBody({
heading: `Application Detail Updated: ${targetName}`,
intro: `An application detail has just been changed. Please see the summary below.`,
lines: [
{ label: 'Field Changed', value: fieldLabels[field] || field },
{ label: 'Previous Value', value: oldValue },
{ label: 'New Value', value: newValue },
{ label: 'Updated By', value: editorLabel }
],
note: 'This was updated directly in the portal. If this was not expected, please review and correct it as needed.'
});
dispatchAppEmailToMany({
recipients: [ADMIN_EMAIL, agentEmail, targetEmail],
subject: `[NEXTGENZ] ${fieldLabels[field] || field} Updated for ${targetName}`,
body,
triggerType: 'account_update',
title: 'Application Detail Updated',
senderName: editorLabel
});
};
// Update user name (Admin control)
const handleUpdateUserName = (userId: string, newName: string) => {
pushStateToUndo();
setUsers((prev) =>
prev.map((u) => (u.id === userId ? { ...u, name: newName } : u))
);
const targetUser = users.find((u) => u.id === userId);
if (targetUser) {
setStudents((prev) =>
prev.map((s) =>
s.studentEmail.toLowerCase() === targetUser.email.toLowerCase()
? { ...s, name: newName }
: s
)
);
}
};
// Comprehensive Admin Student Account & Application Editor
const handleFullEditStudentAccount = (
userId: string,
updatedData: {
name: string;
email: string;
phone: string;
username: string;
password?: string;
passport?: string;
university?: string;
program?: string;
studyLevel?: any;
country?: string;
driveLink?: string;
status?: StudentStatus;
}
) => {
pushStateToUndo();
const targetUser = users.find((u) => u.id === userId);
const oldEmail = targetUser?.email.toLowerCase() || '';
const newEmail = updatedData.email.trim();
// 1. Update User Account
setUsers((prev) =>
prev.map((u) =>
u.id === userId
? {
...u,
name: updatedData.name,
email: newEmail,
phone: updatedData.phone,
username: updatedData.username,
password: updatedData.password || u.password
}
: u
)
);
// 2. Update or Create Student Application Record
setStudents((prev) => {
let matched = false;
const updatedStudents = prev.map((s) => {
if (
(oldEmail && s.studentEmail.toLowerCase() === oldEmail) ||
(newEmail && s.studentEmail.toLowerCase() === newEmail.toLowerCase())
) {
matched = true;
return {
...s,
name: updatedData.name,
studentEmail: newEmail,
passport: updatedData.passport !== undefined ? updatedData.passport : s.passport,
university: updatedData.university !== undefined ? updatedData.university : s.university,
program: updatedData.program !== undefined ? updatedData.program : s.program,
studyLevel: updatedData.studyLevel !== undefined ? updatedData.studyLevel : s.studyLevel,
country: updatedData.country !== undefined ? updatedData.country : s.country,
driveLink: updatedData.driveLink !== undefined ? updatedData.driveLink : s.driveLink,
status: updatedData.status !== undefined ? updatedData.status : s.status
};
}
return s;
});
if (!matched && targetUser?.type === 'student') {
const newStd: StudentRecord = {
id: 'std-' + Date.now(),
name: updatedData.name,
passport: updatedData.passport || 'N/A',
studentEmail: newEmail,
studyLevel: updatedData.studyLevel || 'Bachelor',
country: updatedData.country || 'International',
university: updatedData.university || "Taylor's University",
program: updatedData.program || "Bachelor of Business",
agentUsername: targetUser.username,
status: updatedData.status || 'unfiled',
createdAt: new Date().toISOString(),
driveLink: updatedData.driveLink,
documents: updatedData.driveLink ? {
application_docs: {
key: 'application_docs',
label: 'Student Application Documents Link',
link: updatedData.driveLink,
updatedAt: new Date().toISOString(),
updatedBy: 'admin'
}
} : {}
};
return [newStd, ...updatedStudents];
}
return updatedStudents;
});
// 3. Update active session currentUser if editing logged-in user
if (currentUser && (currentUser.id === userId || (oldEmail && currentUser.email.toLowerCase() === oldEmail))) {
setCurrentUser({
...currentUser,
name: updatedData.name,
email: newEmail,
phone: updatedData.phone,
username: updatedData.username,
password: updatedData.password || currentUser.password
});
}
triggerEmailAlert(
'account_update',
'Student Account & Application Details Updated',
newEmail,
'NEXTGENZ Admin',
`[NEXTGENZ Alert] Account Details Updated for ${updatedData.name}`,
`Profile and application details for ${updatedData.name} (${newEmail}) updated by NEXTGENZ Admin.${
updatedData.status ? ` Status: ${updatedData.status.toUpperCase()}` : ''
}`
);
};
// Admin Actions
// Real Firebase Authentication sign-in. On success, onAuthStateChanged (registered above)
// picks up the new session and flips isAdminActive automatically.
const handleAuthenticateAdmin = async (email: string, password: string): Promise<string | null> => {
try {
await firebase.auth().signInWithEmailAndPassword(email.trim(), password);
return null; // no error
} catch (err: any) {
const code = err && err.code;
if (code === 'auth/invalid-email') return 'That doesn\'t look like a valid email address.';
if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') {
return 'Incorrect email or password. Access denied.';
}
if (code === 'auth/too-many-requests') return 'Too many attempts. Please wait a moment and try again.';
return 'Login failed: ' + (err && err.message ? err.message : 'unknown error');
}
};
const handleAdminSignOut = () => {
firebase.auth().signOut().catch((err: any) => console.error('Sign-out error:', err));
};
const handleApproveRequest = (requestId: string) => {
pushStateToUndo();
const req = requests.find((r) => r.id === requestId);
if (!req) return;
// Create new account
const genUsername = (req.name.replace(/[^a-zA-Z]/g, '').toLowerCase().slice(0, 8) || req.type) + Math.floor(100 + Math.random() * 900);
const genPassword = generateSecurePassword();
const newUser: PortalUser = {
id: 'usr-' + Date.now(),
type: req.type,
username: genUsername,
password: genPassword,
name: req.name,
email: req.email,
phone: req.phone,
status: 'active',
createdAt: new Date().toISOString()
};
setUsers((prev) => [...prev, newUser]);
setRequests((prev) => prev.map((r) => (r.id === requestId ? { ...r, status: 'approved' } : r)));
const body = formatEmailBody({
heading: `Portal Access Approved: ${req.name} (${req.type === 'agent' ? 'Agent' : 'Student'})`,
intro: `Great news! Your NEXTGENZ CENTRE portal access request has been approved. Your login details are below.`,
lines: [
{ label: 'Name', value: req.name },
{ label: 'Email', value: req.email },
{ label: 'Account Type', value: req.type },
{ label: 'Username', value: genUsername },
{ label: 'Temporary Password', value: genPassword }
],
note: 'You can now log in to your portal with the username and temporary password above. We recommend changing your password after first login.'
});
dispatchAppEmailToMany({
recipients: [ADMIN_EMAIL, req.email],
subject: `[NEXTGENZ] Portal Access Approved for ${req.name}`,
body,
triggerType: 'access_request',
title: 'Portal Access Request Approved',
senderName: 'NEXTGENZ Admin'
});
alert(`Approved! Account generated:\nUsername: ${genUsername}\nPassword: ${genPassword}\n\n(These credentials were also emailed to ${req.email}.)`);
};
const handleRejectRequest = (requestId: string) => {
pushStateToUndo();
const req = requests.find((r) => r.id === requestId);
setRequests((prev) => prev.map((r) => (r.id === requestId ? { ...r, status: 'rejected' } : r)));
if (req) {
triggerEmailAlert(
'access_request',
'Portal Access Request Status Updated',
req.email,
'NEXTGENZ Admin',
`[NEXTGENZ Alert] Access Request Status Update for ${req.name}`,
`Access request for ${req.name} (${req.email}) status was updated to REJECTED.`
);
}
};
// Permanently removes a request record (pending, approved, or rejected) rather than just
// changing its status. Covered by the same Undo/Redo history as every other admin action.
const handleDeleteRequest = (requestId: string) => {
const req = requests.find((r) => r.id === requestId);
if (!req) return;
if (!window.confirm(`Permanently delete the access request from "${req.name}"? This cannot be undone except via Undo.`)) return;
pushStateToUndo();
setRequests((prev) => prev.filter((r) => r.id !== requestId));
};
// Permanently deletes a portal account (agent or student). Optionally also removes the
// linked student application record, since a student account with no record left behind
// is rarely what's wanted.
const handleDeleteUserAccount = (userId: string) => {
const u = users.find((x) => x.id === userId);
if (!u) return;
const alsoDeleteRecord =
u.type === 'student' &&
students.some((s) => s.studentEmail.toLowerCase() === u.email.toLowerCase()) &&
window.confirm(
`Delete the account for "${u.name}" (${u.email})?\n\nClick OK to also permanently delete their linked student application record, or Cancel to keep the application record and only remove the login account.`
);
const confirmedPlainDelete =
u.type !== 'student' || !students.some((s) => s.studentEmail.toLowerCase() === u.email.toLowerCase())
? window.confirm(`Permanently delete the account for "${u.name}" (${u.email})? This cannot be undone except via Undo.`)
: true;
if (!confirmedPlainDelete) return;
pushStateToUndo();
setUsers((prev) => prev.filter((x) => x.id !== userId));
if (alsoDeleteRecord) {
setStudents((prev) => prev.filter((s) => s.studentEmail.toLowerCase() !== u.email.toLowerCase()));
}
if (currentUser && currentUser.id === userId) {
setCurrentUser(null);
setActivePortal(null);
}
};
// Permanently deletes a student application record (documents, status, program details) --
// separate from the login account itself, which is deleted independently above.
const handleDeleteStudentRecord = (studentId: string) => {
const s = students.find((x) => x.id === studentId);
if (!s) return;
if (!window.confirm(`Permanently delete the application record for "${s.name}"? This cannot be undone except via Undo.`)) return;
pushStateToUndo();
setStudents((prev) => prev.filter((x) => x.id !== studentId));
};
// Layout controls: reorder or show/hide main page sections. Nav and Footer are fixed and not
// included here since removing either would break navigation entirely.
const handleMoveSectionUp = (id: string) => {
setSectionOrder((prev) => {
const idx = prev.indexOf(id);
if (idx <= 0) return prev;
const next = [...prev];
[next[idx - 1], next[idx]] = [next[idx], next[idx - 1]];
return next;
});
};
const handleMoveSectionDown = (id: string) => {
setSectionOrder((prev) => {
const idx = prev.indexOf(id);
if (idx === -1 || idx >= prev.length - 1) return prev;
const next = [...prev];
[next[idx + 1], next[idx]] = [next[idx], next[idx + 1]];
return next;
});
};
const handleToggleSectionVisibility = (id: string) => {
setHiddenSections((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
};
const handleResetLayout = () => {
setSectionOrder(DEFAULT_SECTION_ORDER);
setHiddenSections([]);
};
const handleUpdateStudentStatus = (studentId: string, status: StudentStatus) => {
pushStateToUndo();
let affectedStudentEmail = 'john.doe@example.com';
let affectedStudentName = 'Student';
setStudents((prev) =>
prev.map((s) => {
if (s.id !== studentId) return s;
affectedStudentEmail = s.studentEmail;
affectedStudentName = s.name;
return { ...s, status };
})
);
triggerEmailAlert(
'status_change',
'Application Status Updated',
affectedStudentEmail,
'NEXTGENZ Admin System',
`[NEXTGENZ Alert] Application Status Changed: "${status.toUpperCase()}" for ${affectedStudentName}`,
`Application status for student ${affectedStudentName} (${affectedStudentEmail}) has been updated to "${status.toUpperCase()}".`
);
};
const handleViewPortalAsUser = (user: PortalUser) => {
setCurrentUser(user);
setActivePortal(user.type);
setIsAdminPreview(true);
};
return (
<div
contentEditable={isAdminActive}
suppressContentEditableWarning
className="font-sans text-gray-800 antialiased bg-[#F5F7FA] overflow-x-hidden min-h-screen"
>
{/* Navigation Bar */}
<HeaderNavbar onOpenPortal={handleOpenPortal} />
{/* Main sections, in admin-configurable order (defaults to the original order below) */}
{sectionOrder
.filter((id) => !hiddenSections.includes(id))
.map((id) => {
switch (id) {
case 'hero':
return <HeroSection key={id} />;
case 'trust':
return <TrustStatsAndMarquee key={id} />;
case 'about':
return <AboutAndWhyMalaysia key={id} />;
case 'services':
return <ServicesAndPortals key={id} onOpenPortal={handleOpenPortal} />;
case 'process':
return <ProcessAndAgents key={id} onRequestAccess={handleRequestAccess} />;
case 'faq':
return <FaqAndContact key={id} onRequestAccess={handleRequestAccess} />;
default:
return null;
}
})}
{/* Footer & Admin Toggle */}
<Footer
onOpenAdmin={() => {
if (isAdminActive) {
handleAdminSignOut();
} else {
setShowAdminAuthModal(true);
}
}}
isAdminActive={isAdminActive}
/>
{/* Floating WhatsApp Widget */}
<a contentEditable={false} suppressContentEditableWarning
href="https://wa.me/60108768308"
target="_blank"
rel="noreferrer"
className="fixed bottom-6 right-6 z-50 flex items-center group cursor-pointer"
aria-label="Chat with us on WhatsApp"
>
<div className="mr-3 bg-white text-[#0F1F38] font-bold text-xs px-3.5 py-2 rounded-xl shadow-lg opacity-0 translate-x-4 group-hover:opacity-100 group-hover:translate-x-0 transition duration-300 pointer-events-none hidden sm:block">
Chat with us!
</div>
<div className="w-14 h-14 bg-[#25D366] text-white rounded-full flex items-center justify-center text-3xl shadow-[0_4px_14px_rgba(37,211,102,0.5)] wa-pulse hover:scale-110 transition-transform">
<i className="fa-brands fa-whatsapp"></i>
</div>
</a>
{/* Live Database Connection Error Banner */}
{firebaseError && (
<div className="fixed top-0 left-0 w-full bg-red-700 text-white text-center py-2 z-[100001] font-semibold text-xs sm:text-sm shadow-lg">
<i className="fa-solid fa-triangle-exclamation mr-1"></i> {firebaseError}
</div>
)}
{/* Floating Undo/Redo History Bar */}
{(undoStack.length > 0 || redoStack.length > 0 || isAdminActive) && (
<div className="fixed bottom-6 left-6 z-50 bg-[#0F1F38]/95 backdrop-blur-md text-white px-4 py-2.5 rounded-2xl border border-[#C5A059]/50 shadow-2xl flex items-center gap-3">
<div className="text-xs font-bold text-[#C5A059] uppercase tracking-wider flex items-center gap-1.5 border-r border-gray-700 pr-3">
<i className="fa-solid fa-clock-rotate-left text-sm"></i> History
</div>
<button contentEditable={false} suppressContentEditableWarning
onClick={handleUndo}
disabled={undoStack.length === 0}
className={`px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition ${
undoStack.length > 0
? 'bg-[#C5A059] text-[#0F1F38] hover:bg-[#D4AF37] cursor-pointer shadow-sm'
: 'bg-gray-800 text-gray-500 cursor-not-allowed opacity-50'
}`}
title="Undo last change (Ctrl+Z)"
>
<i className="fa-solid fa-rotate-left"></i> Undo ({undoStack.length})
</button>
<button contentEditable={false} suppressContentEditableWarning
onClick={handleRedo}
disabled={redoStack.length === 0}
className={`px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition ${
redoStack.length > 0
? 'bg-[#C5A059] text-[#0F1F38] hover:bg-[#D4AF37] cursor-pointer shadow-sm'
: 'bg-gray-800 text-gray-500 cursor-not-allowed opacity-50'
}`}
title="Redo change (Ctrl+Y / Cmd+Shift+Z)"
>
<i className="fa-solid fa-rotate-right"></i> Redo ({redoStack.length})
</button>
</div>
)}
{/* History Toast Notification */}
{historyToast && (
<div className="fixed top-16 left-1/2 transform -translate-x-1/2 z-[100000] bg-[#0F1F38] text-white px-6 py-3 rounded-full shadow-2xl border border-[#C5A059] flex items-center gap-3 text-sm font-bold animate-pulse">
<i className="fa-solid fa-[#C5A059] fa-rotate-left text-[#C5A059] text-lg"></i>
{historyToast}
</div>
)}
{/* Student / Agent Portal Overlays & Login Modal */}
<PortalOverlays
activePortal={activePortal}
currentUser={currentUser}
users={users}
students={students}
messages={messages}
isAdminActive={isAdminActive}
isAdminPreview={isAdminPreview}
onClosePortal={handleClosePortal}
onLoginSubmit={handleLoginSubmit}
onRequestAccess={handleRequestAccess}
onAddStudent={handleAddStudent}
onUpdateDocumentLink={handleUpdateDocumentLink}
onOpenStudentByEmail={handleOpenStudentByEmail}
onSendMessage={handleSendMessage}
onDeleteMessage={handleDeleteMessage}
onUndo={handleUndo}
onRedo={handleRedo}
canUndo={undoStack.length > 0}
canRedo={redoStack.length > 0}
onFullEditStudentAccount={handleFullEditStudentAccount}
onViewPortalAsUser={handleViewPortalAsUser}
onUpdateStudentField={handleUpdateStudentField}
onUpdateStudentStatus={handleUpdateStudentStatus}
onOpenEmailAlerts={() => setShowEmailAlertsModal(true)}
emailAlertCount={emailAlerts.length}
/>
{/* Admin Mode Overlays & Registration Management */}
<AdminOverlays
isAdminActive={isAdminActive}
showAuthModal={showAdminAuthModal}
onCloseAuthModal={() => setShowAdminAuthModal(false)}
onAuthenticateAdmin={handleAuthenticateAdmin}
onExitAdmin={handleAdminSignOut}
onSaveChanges={() => {
const ts = new Date().toISOString();
localStorage.setItem('nextgenz_site_published', ts);
firebase.database().ref('site_content/lastPublished').set(ts).catch((err: any) => console.error('Failed to record publish time:', err));
}}
requests={requests}
users={users}
students={students}
messages={messages}
onApproveRequest={handleApproveRequest}
onRejectRequest={handleRejectRequest}
onDeleteRequest={handleDeleteRequest}
onDeleteUserAccount={handleDeleteUserAccount}
onDeleteStudentRecord={handleDeleteStudentRecord}
sectionOrder={sectionOrder}
hiddenSections={hiddenSections}
onMoveSectionUp={handleMoveSectionUp}
onMoveSectionDown={handleMoveSectionDown}
onToggleSectionVisibility={handleToggleSectionVisibility}
onResetLayout={handleResetLayout}
onUpdateStudentStatus={handleUpdateStudentStatus}
onUpdateDocumentLink={handleUpdateDocumentLink}
onViewPortalAsUser={handleViewPortalAsUser}
onUpdateUserName={handleUpdateUserName}
onOpenStudentByEmail={handleOpenStudentByEmail}
onFullEditStudentAccount={handleFullEditStudentAccount}
onSendMessage={handleSendMessage}
onDeleteMessage={handleDeleteMessage}
onUndo={handleUndo}
onRedo={handleRedo}
canUndo={undoStack.length > 0}
canRedo={redoStack.length > 0}
onOpenEmailAlerts={() => setShowEmailAlertsModal(true)}
emailAlertCount={emailAlerts.length}
/>
{/* Real-time Email Alerts & Dispatcher Modal */}
<EmailAlertsModal
isOpen={showEmailAlertsModal}
onClose={() => setShowEmailAlertsModal(false)}
emailAlerts={emailAlerts}
activeToast={activeToast}
onCloseToast={() => setActiveToast(null)}
onSendTestTrigger={handleSendTestTrigger}
onClearAlerts={() => setEmailAlerts([])}
isAdminActive={isAdminActive}
/>
</div>
);
}

// ==== bootstrap ====
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>

<script>
window.addEventListener('load', function() {
  try {
    if (!window.React || !window.ReactDOM || !window.Babel) {
      throw new Error('One or more required libraries (React, ReactDOM, Babel) failed to load from the CDN. Check your internet connection and try reloading the page.');
    }
    var React = window.React;
    var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef,
        useMemo = React.useMemo, useCallback = React.useCallback, useContext = React.useContext,
        Fragment = React.Fragment;
    var source = document.getElementById('app-source').textContent;
    var output = Babel.transform(source, {
      presets: [["typescript", { isTSX: true, allExtensions: true }], "react"],
      filename: 'app.tsx'
    }).code;
    var fn = new Function('React', 'useState', 'useEffect', 'useRef', 'useMemo', 'useCallback', 'useContext', 'Fragment', 'ReactDOM', 'emailjs', output);
    fn(React, useState, useEffect, useRef, useMemo, useCallback, useContext, Fragment, window.ReactDOM, window.emailjs);
  } catch (err) {
    console.error(err);
    var root = document.getElementById('root');
    if (root) {
      root.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;margin:40px;">' +
        '<strong>Failed to load the app.</strong><br>' + (err && err.message ? err.message : String(err)) +
        '<br><br>Try reloading the page, or check your internet connection (this page loads React, Babel and Tailwind from a CDN).</div>';
    }
  }
});
</script>
