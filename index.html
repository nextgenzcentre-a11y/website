/* ==== Ported Program Finder styles (scoped under .pf-scope) ==== */
/* ==========================================================
   GLOBAL RESET & VARIABLES
   ========================================================== */
.pf-scope {
  --bg: #f8fafc;
  --text: #0f172a;
  --card-bg: #ffffff;
  --card-border: #e2e8f0;
  --primary: #0F1F38; /* NEXTGENZ Navy */
  --primary-hover: #1a2f50;
  --shadow: rgba(0, 0, 0, 0.06);
  --shadow-hover: rgba(0, 0, 0, 0.12);
  --secondary-text: #64748b;
}

.pf-scope {
  margin: 0;
  padding: 0;
  font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background-color: var(--bg);
  color: var(--text);
  transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out;
  box-sizing: border-box;
}
.pf-scope *, .pf-scope *::before, .pf-scope *::after { box-sizing: border-box; }

/* ==========================================================
   LAYOUT CONTAINERS
   ========================================================== */
.app-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0;
  display: flex;
  flex-direction: column;
}

.main-content {
  flex: 1;
}

/* ==========================================================
   LOGIN SCREEN
   ========================================================== */
.login-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  width: 100%;
}
.login-box {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 40px 30px;
  border-radius: 16px;
  box-shadow: 0 10px 25px var(--shadow);
  text-align: center;
  max-width: 420px;
  width: 100%;
}
.login-input {
  width: 100%;
  padding: 14px;
  margin: 20px 0;
  border-radius: 10px;
  border: 1px solid var(--card-border);
  background: var(--bg);
  color: var(--text);
  font-size: 18px;
  text-align: center;
  letter-spacing: 6px;
  font-weight: bold;
  box-sizing: border-box;
}
.login-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.35); }
.login-btn {
  width: 100%;
  background: var(--primary);
  color: white;
  border: none;
  padding: 14px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}
.login-btn:hover { background: var(--primary-hover); transform: translateY(-2px); }
.login-error { color: #ef4444; font-size: 14px; margin-bottom: 15px; font-weight: 600; }

/* ==========================================================
   HEADER + LOGO
   ========================================================== */
.header-box { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
.header-logo { width: 70px; height: 70px; object-fit: contain; }
.header-title { font-size: 28px; font-weight: 700; margin: 0; line-height: 1.2; }
.subtitle { font-size: 16px; opacity: 0.8; margin-bottom: 25px; }

/* ==========================================================
   CONTROLS (LANG, MODE, CURRENCY)
   ========================================================== */
.controls-row { display: flex; gap: 10px; margin-bottom: 25px; justify-content: flex-end; align-items: center;}
.lang-btn, .mode-btn, .currency-btn {
  background: var(--card-bg); border: 1px solid var(--card-border); padding: 10px 16px;
  color: var(--text); font-size: 14px; border-radius: 10px;
  cursor: pointer; transition: 0.2s; font-weight: 600;
  box-shadow: 0 2px 5px var(--shadow);
}
.lang-btn:hover, .mode-btn:hover, .currency-btn:hover { border-color: var(--primary); transform: translateY(-1px); }

/* ==========================================================
   SEARCH + SELECT INPUTS
   ========================================================== */
.input-card {
  background: var(--card-bg); border: 1px solid var(--card-border);
  padding: 25px; border-radius: 16px; box-shadow: 0 6px 15px var(--shadow);
  margin-bottom: 25px;
}
.filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }
.input-label { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: block; color: var(--text); }
.input-box, .select-box {
  width: 100%; padding: 12px; border-radius: 10px;
  border: 1px solid var(--card-border); background: var(--bg);
  color: var(--text); font-size: 14px; box-sizing: border-box; transition: 0.2s;
}
.input-box:focus, .select-box:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.35); }

/* ==========================================================
   FILTER / SORT BAR & NOTICES
   ========================================================== */
.accreditation-notice {
  background: rgba(37, 99, 235, 0.08); border-left: 5px solid var(--primary);
  padding: 18px; border-radius: 8px; margin-bottom: 25px; font-size: 14px; color: var(--text); line-height: 1.5;
}
.filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
.sort-wrapper { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sort-select {
  padding: 8px 12px; border-radius: 8px; border: 1px solid var(--card-border);
  background: var(--card-bg); color: var(--text); font-size: 14px; font-weight: 500;
}
.download-btn {
  background: #10b981; color: white; border: none; padding: 10px 14px;
  border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s;
  display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);
}
.download-btn:hover { background: #059669; transform: translateY(-2px); }

/* ==========================================================
   UNIVERSITY CARDS GRID
   ========================================================== */
.uni-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 25px; margin-bottom: 40px; }
.uni-card {
  background: var(--card-bg); border: 1px solid var(--card-border);
  padding: 22px; border-radius: 16px; box-shadow: 0 6px 15px var(--shadow);
  transition: all 0.3s ease; display: flex; flex-direction: column; position: relative;
}
.uni-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 12px 25px var(--shadow-hover); }

.uni-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
.uni-logo {
  width: 55px; height: 55px; border-radius: 50%; object-fit: cover;
  border: 1px solid var(--card-border); background: var(--bg); padding: 2px; flex-shrink: 0;
}
.uni-name { font-size: 18px; font-weight: 700; color: var(--primary); line-height: 1.3; margin: 0; }
.uni-small { font-size: 13px; color: var(--secondary-text); margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }

/* ==========================================================
   PROGRAMME LIST INSIDE CARD
   ========================================================== */
.prog-list {
  margin-top: 15px; margin-bottom: 20px; border-top: 1px solid var(--card-border);
  padding-top: 15px; max-height: 300px; overflow-y: auto; padding-right: 5px;
}
.prog-list::-webkit-scrollbar { width: 6px; }
.prog-list::-webkit-scrollbar-track { background: transparent; }
.prog-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
.dark .prog-list::-webkit-scrollbar-thumb { background: #475569; }

.prog-item {
  background: var(--bg); padding: 14px; border-radius: 10px;
  margin-bottom: 12px; border: 1px solid var(--card-border); transition: 0.2s;
  position: relative;
}
.prog-item:hover { box-shadow: 0 4px 10px var(--shadow); border-color: #cbd5e1; }
.dark .prog-item:hover { border-color: #475569; }

.prog-item-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.prog-item-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; flex: 1; }

.prog-item-specs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.spec-badge {
  font-size: 11px; background: var(--card-bg); padding: 4px 8px;
  border-radius: 6px; color: var(--secondary-text); border: 1px solid var(--card-border);
  display: inline-flex; align-items: center; font-weight: 500;
}
.prog-item-price { font-size: 14px; color: var(--primary); font-weight: 700; margin-bottom: 5px; }

.ielts-container { display: flex; flex-direction: column; align-items: flex-start; }
.ielts-upsell { 
  font-size: 11px; color: var(--primary); text-decoration: none; font-weight: 600; 
  margin-top: 4px; padding-left: 2px; 
}
.ielts-upsell:hover { text-decoration: underline; }

/* Custom Checkbox */
.compare-checkbox {
  appearance: none; width: 18px; height: 18px; border: 2px solid var(--secondary-text);
  border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: 0.2s; flex-shrink: 0; background: var(--card-bg);
}
.compare-checkbox:checked { background: var(--primary); border-color: var(--primary); }
.compare-checkbox:checked::after { content: '✓'; color: white; font-size: 12px; font-weight: bold; }

/* ==========================================================
   CARD BUTTONS
   ========================================================== */
.card-actions { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
.consult-btn {
  display: block; width: 100%; padding: 12px; background: #25d366; /* WhatsApp Green */
  color: white; text-decoration: none; border-radius: 10px; font-size: 14px;
  font-weight: 600; transition: 0.2s; text-align: center; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.2);
}
.consult-btn:hover { background: #1ebc5a; transform: translateY(-2px); }
.website-link {
  display: block; width: 100%; padding: 10px; background: transparent;
  color: var(--primary); text-decoration: none; border-radius: 10px; font-size: 13px;
  font-weight: 600; transition: 0.2s; text-align: center; border: 2px solid var(--primary); box-sizing: border-box;
}
.website-link:hover { background: rgba(197, 160, 89, 0.08); }

/* ==========================================================
   STICKY COMPARE BAR
   ========================================================== */
.compare-bar {
  position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg);
  border-top: 1px solid var(--card-border); padding: 15px 20px; box-shadow: 0 -4px 15px var(--shadow);
  display: flex; justify-content: space-between; align-items: center; z-index: 100; box-sizing: border-box;
}
.compare-count { font-weight: 600; color: var(--text); font-size: 15px; }
.compare-btn {
  background: var(--primary); color: white; border: none; padding: 10px 20px;
  border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s;
}
.compare-btn:hover { background: var(--primary-hover); transform: translateY(-2px); }

/* ==========================================================
   COMPARE MODAL
   ========================================================== */
.pf-modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
}
.pf-modal-content {
  background: var(--card-bg); width: 100%; max-width: 900px; border-radius: 16px;
  padding: 25px; max-height: 90vh; overflow-y: auto; position: relative;
}
.pf-close-modal {
  position: absolute; top: 20px; right: 20px; background: transparent; border: none;
  font-size: 24px; color: var(--text); cursor: pointer;
}
.rtl .pf-close-modal { right: auto; left: 20px; }
.compare-table-wrapper { overflow-x: auto; margin-top: 20px; }
.compare-table { width: 100%; border-collapse: collapse; min-width: 600px; text-align: left; }
.rtl .compare-table { text-align: right; }
.compare-table th, .compare-table td { padding: 12px 15px; border-bottom: 1px solid var(--card-border); font-size: 14px; color: var(--text); }
.compare-table th { font-weight: 600; background: var(--bg); }

/* ==========================================================
   AI CHATBOT WIDGET
   ========================================================== */
.chat-widget-btn {
  position: fixed; bottom: 85px; right: 25px;
  background: var(--primary); color: white; border: none;
  border-radius: 50%; width: 60px; height: 60px;
  font-size: 28px; box-shadow: 0 4px 15px var(--shadow);
  cursor: pointer; z-index: 1000; transition: 0.3s;
  display: flex; align-items: center; justify-content: center;
}
.rtl .chat-widget-btn { right: auto; left: 25px; }
.chat-widget-btn:hover { transform: scale(1.1); background: var(--primary-hover); }

.chat-window {
  position: fixed; bottom: 160px; right: 25px;
  width: 350px; height: 500px; max-height: 70vh; max-width: 90vw;
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 16px; box-shadow: 0 10px 25px var(--shadow-hover);
  display: flex; flex-direction: column; z-index: 1000;
  overflow: hidden; transition: 0.3s;
}
.rtl .chat-window { right: auto; left: 25px; }
.chat-header {
  background: var(--primary); color: white; padding: 15px;
  font-weight: bold; display: flex; justify-content: space-between;
  align-items: center;
}
.chat-close { background: transparent; border: none; color: white; font-size: 20px; cursor: pointer; }
.chat-body {
  flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px;
}
.chat-msg {
  padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4;
  max-width: 85%;
}

/* Markdown Styles inside Chat */
.chat-msg p { margin: 0 0 8px 0; }
.chat-msg p:last-child { margin: 0; }
.chat-msg ul, .chat-msg ol { margin: 0 0 8px 0; padding-left: 20px; }
.chat-msg li { margin-bottom: 4px; }
.chat-msg a { text-decoration: underline; font-weight: 600; color: var(--primary); }
.chat-msg strong { font-weight: 700; }

.chat-msg.user { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
.chat-msg.user a { color: #ffffff; }
.chat-msg.assistant { background: var(--bg); color: var(--text); border: 1px solid var(--card-border); align-self: flex-start; border-bottom-left-radius: 2px; }
.chat-msg.assistant a { color: var(--primary); }

.chat-input-area {
  display: flex; padding: 10px; border-top: 1px solid var(--card-border); background: var(--bg);
}
.chat-input {
  flex: 1; padding: 10px; border: 1px solid var(--card-border); border-radius: 8px;
  background: var(--card-bg); color: var(--text); font-family: inherit; font-size: 14px;
}
.chat-input:focus { outline: none; border-color: var(--primary); }
.chat-send-btn {
  background: var(--primary); color: white; border: none; padding: 10px 15px;

<div id="google_translate_element" style="position: absolute; left: -9999px; top: -9999px; opacity: 0; pointer-events: none;"></div>
<script>
// Google Translate periodically changes its injected markup (class names, floating icons,
// tooltips) which lets it slip past static CSS hiding rules. This actively watches the whole
// document and instantly hides/removes anything Google Translate injects outside of our own
// intentionally-visible language dropdown (.goog-te-combo), so no stray icon/banner can ever
// appear no matter what markup Google uses.
(function () {
function isGoogleTranslateNoise(el) {
if (!(el instanceof Element)) return false;
if (el.classList && el.classList.contains('goog-te-combo')) return false; // keep our own select
const id = el.id || '';
const cls = el.className && el.className.toString ? el.className.toString() : '';
if (el.tagName === 'IFRAME' && (id.startsWith(':') || /translate/i.test(el.src || ''))) return true;
if (id.startsWith('goog-gt-') || id.startsWith(':')) return true;
if (/goog-te-banner|goog-te-balloon|goog-te-gadget-icon|goog-tooltip|VIpgJd-/.test(cls)) return true;
if (/^skiptranslate$/.test(cls) && el.tagName !== 'BODY') return true;
return false;
}
function sweep(root) {
if (!root || !root.querySelectorAll) return;
root.querySelectorAll('iframe, div, span').forEach((el) => {
if (isGoogleTranslateNoise(el)) {
el.style.setProperty('display', 'none', 'important');
el.style.setProperty('visibility', 'hidden', 'important');
el.style.setProperty('height', '0', 'important');
el.style.setProperty('width', '0', 'important');
el.style.setProperty('pointer-events', 'none', 'important');
}
});
document.documentElement.style.setProperty('top', '0px', 'important');
document.body.style.setProperty('top', '0px', 'important');
}
const observer = new MutationObserver((mutations) => {
mutations.forEach((m) => {
m.addedNodes.forEach((node) => {
if (node.nodeType === 1) {
if (isGoogleTranslateNoise(node)) {
node.style.setProperty('display', 'none', 'important');
}
sweep(node);
}
});
});
sweep(document.body);
});
document.addEventListener('DOMContentLoaded', () => {
sweep(document.body);
observer.observe(document.body, { childList: true, subtree: true });
});
// Also sweep periodically as a safety net for the first few seconds after load,
// since Google Translate's own script can inject its UI asynchronously.
let sweeps = 0;
const interval = setInterval(() => {
sweep(document.body);
sweeps++;
if (sweeps > 40) clearInterval(interval);
}, 250);
})();
</script>

// Server-side email dispatch endpoint (Netlify Function backed by Resend). Replaces the old
// client-side EmailJS integration - see netlify/functions/send-email.js. The Resend API key
// itself lives only in Netlify's environment variables, never in this file.
const SEND_EMAIL_ENDPOINT = '/.netlify/functions/send-email';

// Wraps a plain-text notification body (already nicely formatted by formatEmailBody) in a
// branded HTML email shell - navy header, gold accent, card layout - so every notification
// sent via Resend looks like a real NEXTGENZ CENTRE email instead of a plain text dump.
function buildBrandedEmailHtml(
subject: string,
bodyText: string,
credentials?: { username: string; password: string; loginUrl?: string }
): string {
  const escaped = bodyText
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
  // When credentials are supplied, render them as a bordered card with each value on its
  // own line in a monospace font - on mobile this lets the recipient just tap-and-hold a
  // single value to select+copy it, instead of hunting for it inside a paragraph of text.
  const credentialsHtml = credentials ? `
    <div style="margin-top:24px;border:1px solid #C5A059;border-radius:12px;overflow:hidden;">
      <div style="background:#FBF6EA;padding:10px 18px;font-size:11px;font-weight:800;color:#8a6d1f;letter-spacing:0.06em;">
        LOGIN CREDENTIALS &mdash; TAP &amp; HOLD A VALUE TO COPY
      </div>
      <div style="padding:18px;">
        <div style="margin-bottom:14px;">
          <div style="font-size:11px;color:#8a94a3;font-weight:700;letter-spacing:0.04em;margin-bottom:4px;">USERNAME</div>
          <div style="font-family:Consolas,Menlo,'Courier New',monospace;font-size:16px;background:#F5F7FA;border:1px solid #e7ebf0;border-radius:8px;padding:10px 12px;color:#0F1F38;word-break:break-all;">${credentials.username}</div>
        </div>
        <div>
          <div style="font-size:11px;color:#8a94a3;font-weight:700;letter-spacing:0.04em;margin-bottom:4px;">TEMPORARY PASSWORD</div>
          <div style="font-family:Consolas,Menlo,'Courier New',monospace;font-size:16px;background:#F5F7FA;border:1px solid #e7ebf0;border-radius:8px;padding:10px 12px;color:#0F1F38;word-break:break-all;">${credentials.password}</div>
        </div>
        ${credentials.loginUrl ? `
        <div style="margin-top:16px;">
          <a href="${credentials.loginUrl}" style="display:inline-block;background:#0F1F38;color:#ffffff;text-decoration:none;font-weight:700;font-size:13px;padding:11px 18px;border-radius:8px;">Open Portal Login &rarr;</a>
        </div>` : ''}
      </div>
    </div>` : '';
  return `
<div style="background:#F5F7FA;padding:32px 16px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(15,31,56,0.12);">
    <div style="background:#0F1F38;padding:22px 28px;">
      <span style="color:#C5A059;font-weight:800;font-size:18px;letter-spacing:0.02em;">NEXTGENZ CENTRE</span>
      <div style="color:#9fb0c9;font-size:12px;margin-top:2px;">Admissions Department</div>
    </div>
    <div style="padding:28px;">
      <h2 style="margin:0 0 16px 0;color:#0F1F38;font-size:18px;">${subject}</h2>
      <div style="color:#33415c;font-size:14px;line-height:1.7;white-space:pre-line;">${escaped}</div>
      ${credentialsHtml}
    </div>
    <div style="background:#F5F7FA;padding:16px 28px;border-top:1px solid #e7ebf0;color:#8a94a3;font-size:12px;">
      NEXTGENZ CENTRE &middot; admission@nextgenzcentre.space &middot; wa.me/60108768308
    </div>
  </div>
</div>`.trim();
}

// Sends one email through the Netlify Function above (Resend under the hood). Never throws -
// network/API failures resolve to { ok:false } so callers can log the status without a
// try/catch on every call site.
async function sendEmailViaResend(params: {
to: string;
subject: string;
text: string;
replyTo?: string;
credentials?: { username: string; password: string; loginUrl?: string };
}): Promise<{ ok: boolean; error?: string }> {
  try {
    const res = await fetch(SEND_EMAIL_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        to: params.to,
        subject: params.subject,
        text: params.text,
        html: buildBrandedEmailHtml(params.subject, params.text, params.credentials),
        reply_to: params.replyTo || 'nextgenzcentre@gmail.com'
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return { ok: false, error: data.message || `Resend error (${res.status})` };
    return { ok: true };
  } catch (err: any) {
    return { ok: false, error: err?.message || 'Network error' };
  }
}

// Builds a clean, professional, labeled email body that always ends in a signature block,
// so every notification (chat, status change, new registration, agent application...) looks consistent.
function formatEmailBody(opts: {
heading: string;
intro?: string;
lines: { label: string; value?: string }[];
note?: string;
credentials?: { username: string; password: string; loginUrl?: string };
}): string {
const cleanLines = opts.lines.filter(
(l) => l.value !== undefined && l.value !== null && String(l.value).trim() !== ''
);
const maxLabelLen = cleanLines.reduce((max, l) => Math.max(max, l.label.length), 0);
const rows = cleanLines.map((l) => `${l.label.padEnd(maxLabelLen, ' ')} : ${l.value}`).join('\n');
// Plain-text fallback for the credentials card (used by clients that don't render HTML).
// Each value sits alone on its own line so it's still easy to select and copy manually.
const credentialsBlock = opts.credentials
? [
'',
'LOGIN CREDENTIALS',
'--------------------------------',
'Username:',
opts.credentials.username,
'',
'Temporary Password:',
opts.credentials.password,
opts.credentials.loginUrl ? `\nPortal Link:\n${opts.credentials.loginUrl}` : ''
].join('\n')
: '';
const timestamp = new Date().toLocaleString('en-US', {
year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
});
const parts = [
opts.heading,
'============================================',
'',
opts.intro || '',
'',
rows,
credentialsBlock,
'',
opts.note || '',
'',
`Date: ${timestamp}`,
'',
'--',
'Kind regards,',
'Admission Officer',
'NEXTGENZ CENTRE - Admissions Department',
'admission@nextgenzcentre.space | wa.me/60108768308'
];
const cleaned: string[] = [];
for (let i = 0; i < parts.length; i++) {
if (parts[i] === '' && cleaned[cleaned.length - 1] === '') continue;
cleaned.push(parts[i]);
}
return cleaned.join('\n');
}

type EmailTriggerType = 'chat' | 'document' | 'status_change' | 'access_request' | 'account_update' | 'agent_application' | 'new_student' | 'broadcast' | 'program_interest';

// Sends one email via Resend (through the Netlify Function), logs it to localStorage, and
// mounted component (including the Admin Email Dispatch Logs panel) picks it up live -
// this means components that don't receive triggerEmailAlert as a prop (like the public
// "Become an Agent" and "Free Advisory" forms) can still notify Admin directly.
function dispatchAppEmail(params: {
to: string;
subject: string;
body: string;
triggerType: EmailTriggerType;
title: string;
senderName: string;
credentials?: { username: string; password: string; loginUrl?: string };
}) {
const { to, subject, body, triggerType, title, senderName, credentials } = params;
const formattedDate = new Date().toLocaleString('en-US', {
year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
});
const mailtoUrl = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
const alertLog = {
id: `alert-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
triggerType,
title,
adminEmail: ADMIN_EMAIL,
studentEmail: to,
senderName,
subject,
body,
timestamp: formattedDate,
status: 'sending',
mailtoUrl
};
try {
const saved = localStorage.getItem('nextgenz_email_alerts');
const list = saved ? JSON.parse(saved) : [];
list.unshift(alertLog);
localStorage.setItem('nextgenz_email_alerts', JSON.stringify(list));
} catch (e) { /* ignore storage errors */ }
window.dispatchEvent(new CustomEvent('nextgenz-email-alert', { detail: alertLog }));

(async () => {
let finalStatus = 'sent';
const result = await sendEmailViaResend({ to, subject, text: body, replyTo: 'admission@nextgenzcentre.space', credentials });
if (result.ok) {
finalStatus = 'delivered';
} else {
console.warn('Resend dispatch note:', result.error);
finalStatus = 'failed';
}
try {
const saved = localStorage.getItem('nextgenz_email_alerts');
const list = saved ? JSON.parse(saved) : [];
const updated = list.map((item: any) => (item.id === alertLog.id ? { ...item, status: finalStatus } : item));
localStorage.setItem('nextgenz_email_alerts', JSON.stringify(updated));
} catch (e) { /* ignore storage errors */ }
window.dispatchEvent(new CustomEvent('nextgenz-email-alert-update', { detail: { id: alertLog.id, status: finalStatus } }));
})();

return alertLog;
}

// Sends the same formatted email to several recipients at once (dedupes + skips blanks) -
// this is how one status change reaches Admin, the Agent, and the Student in one call.
function dispatchAppEmailToMany(params: {
recipients: (string | undefined | null)[];
subject: string;
body: string;
triggerType: EmailTriggerType;
title: string;
senderName: string;
credentials?: { username: string; password: string; loginUrl?: string };
}) {
const unique = Array.from(new Set(params.recipients.filter((r): r is string => !!r && r.includes('@'))));
unique.forEach((to) => dispatchAppEmail({ ...params, to }));
return unique;
}

// Generates a random, readable temporary password (e.g. "Nx7kLp2q") for new portal accounts
function generateSecurePassword(): string {
const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
let pwd = '';
for (let i = 0; i < 10; i++) pwd += chars[Math.floor(Math.random() * chars.length)];
return pwd;
}

// Tracks admin mode globally so EditableImage (used deep in components that don't receive
// isAdminActive as a prop) can react without heavy prop-drilling.

// Converts a Google Drive share link, "open?id=" link, or a bare Drive File ID into a
// directly-embeddable image URL. Any other URL (Unsplash, phototourl CDN, etc.) passes through unchanged.
function resolveImageUrl(input: string): string {
const trimmed = (input || '').trim();
if (!trimmed) return trimmed;
if (/^https?:\/\/lh3\.googleusercontent\.com\/d\//.test(trimmed)) return trimmed;
let match = trimmed.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
if (match) return `https://lh3.googleusercontent.com/d/${match[1]}`;
match = trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
if (match) return `https://lh3.googleusercontent.com/d/${match[1]}`;
match = trimmed.match(/drive\.usercontent\.google\.com\/download\?id=([a-zA-Z0-9_-]+)/);
if (match) return `https://lh3.googleusercontent.com/d/${match[1]}`;
if (/^[a-zA-Z0-9_-]{15,100}$/.test(trimmed) && !trimmed.startsWith('http')) {
return `https://lh3.googleusercontent.com/d/${trimmed}`;
}
return trimmed;
}

// Image overrides now sync via Firebase like text overrides do — shared globally, not per-browser.
let __imageOverridesCache: Record<string, string> = {};
function readImageOverrides(): Record<string, string> {
return __imageOverridesCache;
}
function broadcastImageOverrides() {
window.dispatchEvent(new CustomEvent('nextgenz-image-overrides', { detail: __imageOverridesCache }));
}
// Attach live Firebase listener at startup (before any component mounts) so we catch updates immediately.
try {
firebase.database().ref('site_content/imageOverrides').on('value', (snapshot: any) => {
const val = snapshot.val() || {};
if (JSON.stringify(val) !== JSON.stringify(__imageOverridesCache)) {
__imageOverridesCache = val;
broadcastImageOverrides();
console.log('Image overrides updated from Firebase:', val);
}
});
} catch (e) {
console.error('Could not attach live image-content listener:', e);
}
// Saves an image override to Firebase and waits for confirmation before resolving.
// Shows user feedback if the save fails.
async function saveImageOverridesAsync(map: Record<string, string>): Promise<boolean> {
try {
__imageOverridesCache = map;
broadcastImageOverrides();
await firebase.database().ref('site_content/imageOverrides').set(map);
console.log('Image overrides saved to Firebase successfully:', map);
return true;
} catch (err: any) {
console.error('Failed to save image overrides to Firebase:', err);
alert(`Error saving image: ${err.message || 'Unknown error'}. Please try again.`);
return false;
}
}

// Small pieces of site text (phone numbers, email, address, etc.) that admin needs to be able
// to change are wrapped in this component. Unlike the general "click anywhere and type" mode
// on the page body (which only edits the live DOM in that one browser tab and is never saved
// anywhere), this component persists to Firebase under site_content/textOverrides -- readable
// by every visitor, writable only by a signed-in admin -- so edits are real, permanent, and
// show up for every visitor immediately.
let __textOverridesCache: Record<string, string> = {};
function readTextOverrides(): Record<string, string> {
return __textOverridesCache;
}
function broadcastTextOverrides() {
window.dispatchEvent(new CustomEvent('nextgenz-text-overrides', { detail: __textOverridesCache }));
}
// Start listening the moment this script loads (site_content is public-read, so this works
// for every visitor, not just the admin) rather than waiting on any particular component to mount.
try {
firebase.database().ref('site_content/textOverrides').on('value', (snapshot: any) => {
__textOverridesCache = snapshot.val() || {};
broadcastTextOverrides();
});
} catch (e) {
console.error('Could not attach live text-content listener:', e);
}
const EditableText: React.FC<{
id: string;
defaultText: string;
className?: string;
}> = ({ id, defaultText, className }) => {
const [adminMode, setAdminMode] = useState(__adminModeActive);
const [currentText, setCurrentText] = useState(() => readTextOverrides()[id] || defaultText);
const [hasOverride, setHasOverride] = useState(() => !!readTextOverrides()[id]);
useEffect(() => {
const adminHandler = (e: any) => setAdminMode(e.detail);
const textHandler = (e: any) => {
const map = e.detail || {};
setCurrentText(map[id] || defaultText);
setHasOverride(!!map[id]);
};
window.addEventListener('nextgenz-admin-mode', adminHandler);
window.addEventListener('nextgenz-text-overrides', textHandler);
// Pick up a value that may have already loaded before this component mounted.
const already = readTextOverrides()[id];
if (already) {
setCurrentText(already);
setHasOverride(true);
}
return () => {
window.removeEventListener('nextgenz-admin-mode', adminHandler);
window.removeEventListener('nextgenz-text-overrides', textHandler);
};
}, [id, defaultText]);
const saveOverrides = (map: Record<string, string>) => {
__textOverridesCache = map;
broadcastTextOverrides();
firebase
.database()
.ref('site_content/textOverrides')
.set(map)
.catch((err: any) => console.error('Failed to save text edit:', err));
};
const handleEditClick = (e: React.MouseEvent) => {
e.preventDefault();
e.stopPropagation();
const input = window.prompt('Edit this text:', currentText);
if (input === null) return; // cancelled - no change
const trimmed = input.trim();
if (!trimmed || trimmed === currentText) return;
saveOverrides({ ...readTextOverrides(), [id]: trimmed });
};
const handleReset = (e: React.MouseEvent) => {
e.preventDefault();
e.stopPropagation();
const map = { ...readTextOverrides() };
delete map[id];
saveOverrides(map);
};
if (!adminMode) {
return <span className={className}>{currentText}</span>;
}
return (
<span className="relative inline-flex items-center gap-1.5">
<span className={className}>{currentText}</span>
<button
contentEditable={false}
suppressContentEditableWarning
onClick={handleEditClick}
title="Edit text"
className="inline-flex items-center justify-center w-5 h-5 rounded-full bg-[#C5A059] text-[#0F1F38] text-[10px] hover:scale-110 transition cursor-pointer flex-shrink-0 align-middle"
>
<i className="fa-solid fa-pen"></i>
</button>
{hasOverride && (
<button
contentEditable={false}
suppressContentEditableWarning
onClick={handleReset}
title="Reset to original"
className="inline-flex items-center justify-center w-5 h-5 rounded-full bg-white/90 text-red-600 text-[10px] hover:bg-white cursor-pointer flex-shrink-0 align-middle border border-red-200"
>
<i className="fa-solid fa-rotate-left"></i>

)}

return () => document.removeEventListener('mousedown', handleClickOutside);
}, []);
// Initialize google translate on mount if element exists
useEffect(() => {
if (typeof (window as any).googleTranslateElementInit === 'function') {
try {
(window as any).googleTranslateElementInit();
} catch (err) {
console.warn('Google Translate mount trigger:', err);
}
}
}, []);
// Detect current language from google cookie on load
useEffect(() => {
const cookies = document.cookie.split(';');
const googCookie = cookies.find((c) => c.trim().startsWith('googtrans='));
if (googCookie) {
const val = googCookie.split('=')[1];
if (val) {
const parts = val.split('/');
const langCode = parts[parts.length - 1];
const match = LANGUAGES.find((l) => l.code.toLowerCase() === langCode.toLowerCase());
if (match) {
setCurrentLang(match);
if (match.code === 'ar') {
document.documentElement.setAttribute('dir', 'rtl');
}
}
}
}
}, []);
const changeLanguage = (lang: LanguageOption) => {
setCurrentLang(lang);
setIsOpen(false);
// RTL handling for Arabic
if (lang.code === 'ar') {
document.documentElement.setAttribute('dir', 'rtl');
} else {
document.documentElement.setAttribute('dir', 'ltr');
}
const domain = window.location.hostname;
if (lang.code === 'en') {
// Clear cookie for English
document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
if (domain) {
document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=${domain}`;
}
} else {
// Set cookie for Google Translate across all path variations
document.cookie = `googtrans=/auto/${lang.code}; path=/;`;
document.cookie = `googtrans=/en/${lang.code}; path=/;`;
if (domain) {
document.cookie = `googtrans=/auto/${lang.code}; path=/; domain=${domain}`;
document.cookie = `googtrans=/en/${lang.code}; path=/; domain=${domain}`;
}
}
// Attempt to trigger select element directly if loaded
const triggerTranslate = () => {
const selectElem = document.querySelector('.goog-te-combo') as HTMLSelectElement;
if (selectElem) {
selectElem.value = lang.code;
selectElem.dispatchEvent(new Event('change'));
return true;
}
return false;
};
if (!triggerTranslate()) {
// Retry after short delay or reload to apply cookies
setTimeout(() => {
if (!triggerTranslate()) {
window.location.reload();
}
}, 300);
}
};
return (
<div className="relative inline-block text-left" ref={dropdownRef}>
<button contentEditable={false} suppressContentEditableWarning

const EditableSelectField: React.FC<{
label: string;

otherLabel: string;
canEdit: boolean;
lockedMessage?: string;
onSave: (newValue: string) => void;
valueClassName?: string;
}> = ({ label, value, options, otherLabel, canEdit, lockedMessage, onSave, valueClassName }) => {

const isCurrentlyOther = !!value && !options.includes(value);

const [otherVal, setOtherVal] = useState(isCurrentlyOther ? value : '');

</p>
)}
</div>
);
}
if (!editing) {
return (
<div>
{label && <p className="text-xs text-gray-400 font-bold uppercase mb-1">{label}</p>}
<div className="flex items-center gap-2 flex-wrap">

))}

suppressContentEditableWarning

/* ============================================
   PROGRAMME SPECS ESTIMATOR (Duration & IELTS)
============================================ */
function getProgramSpecs(progName, lang) {
  const lower = progName.toLowerCase();
  let durEn = "Check Website", ielts = "Check Website";

  if (lower.includes("foundation") || lower.includes("certificate") || lower.includes("a-level") || lower.includes("ausmat")) {
    durEn = "1 Year";
    ielts = "5.0 - 5.5";
  } else if (lower.includes("diploma")) {
    durEn = (lower.includes("nursing") || lower.includes("medical") || lower.includes("health")) ? "3 Years" : "2 - 2.5 Years";
    ielts = "5.0 - 5.5";
  } else if (lower.includes("doctor of medicine") || lower.includes("mbbs") || lower.includes("dental") || lower.includes("dentistry")) {
    if (lower.includes("master") || lower.includes("phd") || lower.includes("doctor in") || lower.includes("doctorate")) {
        durEn = "3 - 4 Years";
        ielts = "6.0 - 7.0";
    } else {
        durEn = "5 Years";
        ielts = "6.0 - 7.0";
    }
  } else if (lower.includes("bachelor") || lower.includes("bsc") || lower.includes("ba ") || lower.includes("bba") || lower.match(/\b(beng|bmus|bca)\b/)) {
    if (lower.includes("engineering") || lower.includes("pharmacy") || lower.includes("law ") || lower.includes("dentistry")) {
      durEn = "4 Years";
      ielts = "6.0";
    } else if (lower.includes("architecture")) {
      durEn = "3 - 4 Years";
      ielts = "6.0";
    } else {
      durEn = "3 - 3.5 Years";
      ielts = "5.5 - 6.0";
    }
  } else if (lower.includes("master") || lower.includes("msc") || lower.includes("mba") || lower.match(/\b(mmed|mphil|ma)\b/)) {
    durEn = "1 - 2 Years";
    ielts = "6.0 - 6.5";
  } else if (lower.includes("phd") || lower.includes("doctor of philosophy") || lower.includes("dba") || lower.includes("doctor of business") || lower.includes("doctor of education") || lower.includes("doctor of technology")) {
    durEn = "3 - 4 Years";
    ielts = "6.0 - 6.5";
  }

  let durAr = durEn.replace("Years", "سنوات").replace("Year", "سنة").replace("Check Website", "راجع الموقع");
  let ieltsAr = ielts === "Check Website" ? "راجع الموقع" : ielts;

  return {
    duration: lang === "ar" ? durAr : durEn,
    ielts: lang === "ar" ? ieltsAr : ielts
  };
}

// and Admin portals as "Find Your Program". The visitor is already authenticated by the
// portal itself, so the finder's own PIN gate and dark-mode toggle (which used to flip the
// whole page's theme) have been removed. Selecting "Notify My Advisor" on a program calls
// onSelectProgram(details), which the portal wires up to the same email/Firebase alert
// pipeline used for chat messages and status changes - so NEXTGENZ Admin is notified of
// exactly what program and university the visitor is interested in.
function ProgramFinderApp({ currentUser, onSelectProgram }) {
  const [search, setSearch] = React.useState("");
  const [selectedSpecialty, setSelectedSpecialty] = React.useState("");
  const [selectedLevel, setSelectedLevel] = React.useState(""); 
  const [selectedType, setSelectedType] = React.useState(""); 
  const [selectedMode, setSelectedMode] = React.useState(""); 
  const [selectedDuration, setSelectedDuration] = React.useState(""); 
  const [selectedAccreditation, setSelectedAccreditation] = React.useState("");
  const [selectedLocation, setSelectedLocation] = React.useState("");
  const [selectedIntake, setSelectedIntake] = React.useState("");
  
  const [sortOption, setSortOption] = React.useState("default"); 
  const [lang, setLang] = React.useState("en");
  const [currency, setCurrency] = React.useState("MYR");
  
  const [visibleCount, setVisibleCount] = React.useState(20);
  const [shortlist, setShortlist] = React.useState([]);
  const [showCompareModal, setShowCompareModal] = React.useState(false);
  // Tracks which program cards were just sent to the advisor, so the button can show a
  // "Sent!" confirmation instead of silently doing nothing.
  const [notifiedIds, setNotifiedIds] = React.useState({});

  const t = (en, ar) => (lang === "en" ? en : ar);

  const handleNotifyInterest = (u, progName, priceStr, specs) => {
    const notifyId = `${u.shortName}-${progName}`;
    if (onSelectProgram) {
      onSelectProgram({
        university: u.university,
        universityShort: u.shortName,
        program: progName,
        price: formatPrice(priceStr, u.currency, currency),
        duration: specs.duration,
        ielts: specs.ielts,
        location: u.location
      });
    }
    setNotifiedIds((prev) => ({ ...prev, [notifyId]: true }));
  };

  const handleShortlist = (u, progName, price, specs) => {
    const isSelected = shortlist.some(item => item.id === `${u.shortName}-${progName}`);
    if (isSelected) {
      setShortlist(shortlist.filter(item => item.id !== `${u.shortName}-${progName}`));
    } else {
      if (shortlist.length >= 4) {
        alert(t("You can only compare up to 4 programs.", "يمكنك مقارنة حتى 4 برامج فقط."));
        return;
      }
      setShortlist([...shortlist, { 
        id: `${u.shortName}-${progName}`,
        uniName: u.university, uniShort: u.shortName, progName, price, 
        baseCurrency: u.currency,
        duration: specs.duration, ielts: specs.ielts 
      }]);
    }
  };

  const levelMatch = (progName, level) => {
    if (!level) return true;
    const lowerName = progName.toLowerCase();
    if (level === "Foundation") return lowerName.includes("foundation") || lowerName.includes("certificate") || lowerName.includes("a-level") || lowerName.includes("ausmat");
    if (level === "Diploma") return lowerName.includes("diploma") && !lowerName.includes("postgraduate");
    if (level === "Bachelor") {
      if (lowerName.includes("doctor of medicine") || lowerName.includes("doctor of dental")) return true;
      return lowerName.includes("bachelor") || lowerName.includes("degree") || /\b(bsc|ba|beng|bba|bca|bmus|bds|mbbs|md)\b/.test(lowerName);
    }
    if (level === "Master") return lowerName.includes("master") || lowerName.includes("postgraduate") || /\b(msc|mba|mmed|mphil|ma)\b/.test(lowerName);
    if (level === "PhD") {
      if (lowerName.includes("doctor of medicine") || lowerName.includes("doctor of dental")) return false;
      return lowerName.includes("doctor") || lowerName.includes("phd") || /\b(dba|edd|deng|dtm|drph)\b/.test(lowerName);
    }
    return true;
  };

  /* ============================================
     FIXED PRICE NORMALIZATION & CONVERSION
  ============================================ */
  const getPriceNum = (str) => {
    if (!str) return Infinity;
    const firstPart = str.split('-')[0]; 
    const match = firstPart.replace(/,/g, '').match(/\d+(\.\d+)?/);
    let val = match ? parseFloat(match[0]) : Infinity;
    
    if (val === Infinity) return val;

    const lower = str.toLowerCase();
    // Normalization: 2 semesters per year for fair sorting
    if (lower.includes("semester") || lower.includes("sem")) {
      return val * 2; 
    }
    return val;
  };

  const formatPrice = (priceStr, baseCurrency, targetCurrency) => {
    if (!priceStr) return t("Check Website", "راجع الموقع");
    
    // 1. Extract raw numeric part
    const match = priceStr.replace(/,/g, '').match(/\d+(\.\d+)?/);
    if (!match) return priceStr;
    let num = parseFloat(match[0]);

    // 2. Convert based on constant rate 4.5
    let converted = num;
    const rate = 4.5;
    if (baseCurrency === "MYR" && targetCurrency === "USD") converted = num / rate;
    if (baseCurrency === "USD" && targetCurrency === "MYR") converted = num * rate;

    const formattedNum = new Intl.NumberFormat('en-US', { 
      style: 'currency', 
      currency: targetCurrency, 
      maximumFractionDigits: 0 
    }).format(converted);

    // 3. Append Suffix & Translate Context
    let suffix = "";
    const lower = priceStr.toLowerCase();
    if (lower.includes("semester")) suffix = lang === "ar" ? " (لكل فصل)" : " (Per Sem)";
    else if (lower.includes("year")) suffix = lang === "ar" ? " (سنوياً)" : " (Per Year)";
    else if (lower.includes("total")) suffix = lang === "ar" ? " (الإجمالي)" : " (Total)";

    return `${formattedNum}${suffix}`;
  };

  const matchingUniversities = React.useMemo(() => {
    let universities = JSON.parse(JSON.stringify(rawData)); 

    const searchTokens = search.toLowerCase().trim().split(/\s+/).filter(k => k.length > 0);
    const specKeywords = (selectedSpecialty && SPECIALTIES[selectedSpecialty]) ? SPECIALTIES[selectedSpecialty].keywords : null;

    universities.forEach(u => {
      const uniType = universityTypes[u.shortName] || u.type;
      
      if (selectedType && uniType !== selectedType) { u.programmes = {}; return; }
      if (selectedLocation && u.location !== selectedLocation) { u.programmes = {}; return; }
      if (selectedIntake && (!u.intakes || !u.intakes.includes(selectedIntake))) { u.programmes = {}; return; }

      if (selectedAccreditation) {
        const rules = ACCREDITATION_RULES[selectedAccreditation];
        if (rules.allowedUnis && !rules.allowedUnis.includes(u.shortName)) {
          u.programmes = {}; return;
        }
      }

      const filteredProgs = {};
      let minPriceForUni = Infinity;
      let maxPriceForUni = -Infinity;

      for (const [progName, price] of Object.entries(u.programmes)) {
        const lowerName = progName.toLowerCase();
        const specs = getProgramSpecs(progName, "en"); 
        
        if (selectedLevel && !levelMatch(progName, selectedLevel)) continue;
        if (specKeywords && !specKeywords.some(kw => lowerName.includes(kw))) continue;

        if (searchTokens.length > 0) {
          const translatedP = translateProgramName(progName, "ar").toLowerCase();
          const matchesSearch = searchTokens.every(token => {
             const synonymsForToken = getSynonyms(token);
             return synonymsForToken.some(syn => lowerName.includes(syn) || translatedP.includes(syn));
          });
          if (!matchesSearch) continue;
        }

        if (selectedDuration && !specs.duration.includes(selectedDuration)) continue;

        if (selectedMode) {
          const isPostGrad = lowerName.includes("master") || lowerName.includes("phd") || lowerName.includes("doctor");
          if (selectedMode === "Research" && !lowerName.includes("research")) continue;
          if (selectedMode === "Mixed" && !lowerName.includes("mixed")) continue;
          if (selectedMode === "Coursework") {
            if (isPostGrad && !lowerName.includes("coursework") && !lowerName.includes("mixed") && lowerName.includes("research")) continue; 
            if (isPostGrad && lowerName.includes("research")) continue;
          }
        }

        if (selectedAccreditation === "Oman") {
          if ((lowerName.includes("mbbs") || lowerName.includes("doctor of medicine") || lowerName.includes("bachelor of medicine") || lowerName.includes("dental surgery")) && !lowerName.includes("phd")) continue;
          if (u.shortName === "APU" && !levelMatch(progName, "PhD")) continue;
          if (u.shortName === "UCSI" && (lowerName === "dba" || lowerName.includes("doctor of business administration"))) continue;
        }
        if (selectedAccreditation === "Saudi Arabia") {
          if (lowerName.includes("odl") || lowerName.includes("online") || lowerName.includes("on-line") || lowerName.includes("distance")) continue;
        }

        let numPrice = getPriceNum(price);
        if (numPrice !== Infinity && u.currency === "USD") numPrice *= 4.5;
        
        if (numPrice < minPriceForUni) minPriceForUni = numPrice;
        if (numPrice !== Infinity && numPrice > maxPriceForUni) maxPriceForUni = numPrice;

        filteredProgs[progName] = price;
      }
      
      u.programmes = filteredProgs;
      u.minPrice = minPriceForUni;
      u.maxPrice = maxPriceForUni === -Infinity ? Infinity : maxPriceForUni;
    });

    universities = universities.filter(u => Object.keys(u.programmes).length > 0);

    if (sortOption === "default") return universities;
    return universities.sort((a, b) => {
      if (sortOption === "type") return (universityTypes[a.shortName] || a.type).localeCompare(universityTypes[b.shortName] || b.type);
      if (sortOption === "priceAsc") return a.minPrice - b.minPrice;
      if (sortOption === "priceDesc") {
        const aVal = a.maxPrice === Infinity ? -1 : a.maxPrice;
        const bVal = b.maxPrice === Infinity ? -1 : b.maxPrice;
        return bVal - aVal;
      }
      return 0;
    });
  }, [search, selectedSpecialty, selectedLevel, selectedType, selectedMode, selectedDuration, selectedAccreditation, selectedLocation, selectedIntake, sortOption, currency, lang]);

  const displayedUniversities = matchingUniversities.slice(0, visibleCount);

  const downloadCSV = () => {
    if (matchingUniversities.length === 0) return;
    const headers = ["University", "Location", "Intakes", "Type", "Programme", "Duration", "IELTS Requirement", `Price (${currency})`];
    const rows = [];

    matchingUniversities.forEach(u => {
      const uniType = universityTypes[u.shortName] || u.type;
      Object.entries(u.programmes).forEach(([progName, priceStr]) => {
        const specs = getProgramSpecs(progName, "en"); 
        const formattedPrice = formatPrice(priceStr, u.currency, currency);
        rows.push([
          `"${u.university}"`, `"${u.location || ''}"`, `"${u.intakes || ''}"`, `"${uniType}"`,
          `"${progName}"`, `"${specs.duration}"`, `"${specs.ielts}"`, `"${formattedPrice}"`
        ].join(","));
      });
    });

    const csvContent = headers.join(",") + "\n" + rows.join("\n");
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", "university_results.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  return (
    <div className={`pf-scope ${lang === "ar" ? "rtl" : "ltr"}`} dir={lang === "ar" ? "rtl" : "ltr"}>
      <div className="app-container">
        
        <div className="main-content">
          <div className="pf-toolbar">
            <div>
              <p className="pf-eyebrow">{t("NEXTGENZ Program Finder", "أداة البحث عن البرامج")}</p>
              <h1 className="pf-heading">{t("Find Your Program", "ابحث عن برنامجك")}</h1>
              <p className="subtitle" style={{margin: "6px 0 0 0"}}>
                {t("Search 500+ programs across Malaysia's top universities, side-by-side.", "ابحث بين أكثر من 500 برنامج في أفضل الجامعات الماليزية، جنبًا إلى جنب.")}
              </p>
            </div>
            <div className="controls-row" style={{marginBottom: 0}}>
              <select className="currency-btn" value={currency} onChange={e => setCurrency(e.target.value)}>
                <option value="MYR">MYR (RM)</option>
                <option value="USD">USD ($)</option>
              </select>
              <button className="lang-btn" onClick={() => setLang(lang === "en" ? "ar" : "en")}>{t("عربي", "English")}</button>
            </div>
          </div>

          <div className="input-card">
            <div className="filter-grid">
              <div>
                <label className="input-label">{t("Accreditation", "الاعتماد الأكاديمي")}</label>
                <select className="select-box" value={selectedAccreditation} onChange={(e) => setSelectedAccreditation(e.target.value)}>
                  <option value="">{t("Any Country (No Filter)", "جميع الدول (بدون تصفية)")}</option>
                  {Object.keys(ACCREDITATION_RULES).map(country => (
                    <option key={country} value={country}>{t(country, country === "Oman" ? "عُمان" : country === "UAE" ? "الإمارات" : country === "Saudi Arabia" ? "السعودية" : "العراق")}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="input-label">{t("Field of Study / Specialty", "التخصص الدراسي")}</label>
                <select className="select-box" value={selectedSpecialty} onChange={(e) => setSelectedSpecialty(e.target.value)}>
                  <option value="">{t("All Specialties (80+ Options)", "جميع التخصصات (أكثر من 80 تخصص)")}</option>
                  {Object.keys(SPECIALTIES).sort().map(spec => (
                    <option key={spec} value={spec}>{t(spec, SPECIALTIES[spec].ar)}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="input-label">{t("Study Level", "مستوى الدراسة")}</label>
                <select className="select-box" value={selectedLevel} onChange={(e) => setSelectedLevel(e.target.value)}>
                  <option value="">{t("All Levels", "جميع المستويات")}</option>
                  <option value="Foundation">{t("Foundation & Certificate", "السنة التأسيسية والشهادات")}</option>
                  <option value="Diploma">{t("Diploma", "دبلوم")}</option>
                  <option value="Bachelor">{t("Bachelor's Degree", "بكالوريوس")}</option>
                  <option value="Master">{t("Master's Degree", "ماجستير")}</option>
                  <option value="PhD">{t("PhD & Doctorate", "دكتوراه")}</option>
                </select>
              </div>

              <div>
                <label className="input-label">{t("Institution Type", "نوع المؤسسة")}</label>
                <select className="select-box" value={selectedType} onChange={(e) => setSelectedType(e.target.value)}>
                  <option value="">{t("All Types", "جميع الأنواع")}</option>
                  <option value="Public">{t("Public", "حكومي")}</option>
                  <option value="Private">{t("Private", "خاص")}</option>
                </select>
              </div>

              <div>
                <label className="input-label">{t("Location", "الموقع")}</label>
                <select className="select-box" value={selectedLocation} onChange={(e) => setSelectedLocation(e.target.value)}>
                  <option value="">{t("All Locations", "جميع المواقع")}</option>
                  <option value="Kuala Lumpur">{t("Kuala Lumpur", "كوالالمبور")}</option>
                  <option value="Selangor">{t("Selangor", "سيلانجور")}</option>
                  <option value="Penang">{t("Penang", "بينانج")}</option>
                  <option value="Johor">{t("Johor", "جوهور")}</option>
                  <option value="Kedah">{t("Kedah", "قدح")}</option>
                  <option value="Perak">{t("Perak", "بيراك")}</option>
                  <option value="Negeri Sembilan">{t("Negeri Sembilan", "نجري سمبيلان")}</option>
                  <option value="Melaka">{t("Melaka", "ملاكا")}</option>
                  <option value="Pahang">{t("Pahang", "باهانج")}</option>
                </select>
              </div>

              <div>
                <label className="input-label">{t("Intake Month", "شهر القبول")}</label>
                <select className="select-box" value={selectedIntake} onChange={(e) => setSelectedIntake(e.target.value)}>
                  <option value="">{t("Any Intake", "أي قبول")}</option>
                  {["Jan", "Feb", "Mar", "May", "Jul", "Sep", "Oct", "Nov"].map(m => (
                     <option key={m} value={m}>{t(m, translateIntakes(m, 'ar'))}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="input-label">{t("Duration (Years)", "مدة الدراسة")}</label>
                <select className="select-box" value={selectedDuration} onChange={(e) => setSelectedDuration(e.target.value)}>
                  <option value="">{t("Any Duration", "أي مدة")}</option>
                  <option value="1">{t("1 Year", "سنة واحدة")}</option>
                  <option value="2">{t("2 Years", "سنتين")}</option>
                  <option value="3">{t("3 Years", "3 سنوات")}</option>
                  <option value="4">{t("4 Years", "4 سنوات")}</option>
                  <option value="5">{t("5 Years", "5 سنوات")}</option>
                </select>
              </div>

              <div>
                <label className="input-label">{t("Study Mode", "نظام الدراسة")}</label>
                <select className="select-box" value={selectedMode} onChange={(e) => setSelectedMode(e.target.value)}>
                  <option value="">{t("All Modes", "جميع الأنظمة")}</option>
                  <option value="Coursework">{t("Coursework", "مواد دراسية")}</option>
                  <option value="Research">{t("Research", "بحث علمي")}</option>
                  <option value="Mixed">{t("Mixed Mode", "نظام مختلط")}</option>
                </select>
              </div>

              <div style={{ gridColumn: "1 / -1" }}>
                <label className="input-label">{t("Keyword Search", "البحث السريع")}</label>
                <input
                  className="input-box"
                  type="text"
                  placeholder={t("e.g. Medicine, Dentistry, AI...", "مثل: الطب، صيدلة، الذكاء الاصطناعي...")}
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                />
              </div>

            </div>
          </div>

          {selectedAccreditation && ACCREDITATION_RULES[selectedAccreditation] && (
            <div className="accreditation-notice">
              {t(ACCREDITATION_RULES[selectedAccreditation].notice.en, ACCREDITATION_RULES[selectedAccreditation].notice.ar)}
            </div>
          )}

          <div className="filter-bar">
             <h2 className="result-title">
               {t("Matching Universities:", "الجامعات المطابقة:")} <span className="result-highlight">{matchingUniversities.length}</span>
             </h2>

             {matchingUniversities.length > 0 && (
               <div className="sort-wrapper">
                 <button className="download-btn" onClick={downloadCSV}>
                   📥 {t("Download CSV", "تحميل CSV")}
                 </button>
                 <span className="input-label" style={{marginBottom:0}}>
                   {t("Sort By:", "ترتيب حسب:")}
                 </span>
                 <select className="sort-select" value={sortOption} onChange={(e) => setSortOption(e.target.value)}>
                   <option value="default">{t("Default", "افتراضي")}</option>
                   <option value="priceAsc">{t("Price (Low to High)", "السعر (من الأقل للأعلى)")}</option>
                   <option value="priceDesc">{t("Price (High to Low)", "السعر (من الأعلى للأقل)")}</option>
                   <option value="type">{t("Type (Public/Private)", "النوع (حكومي/خاص)")}</option>
                 </select>
               </div>
             )}
          </div>

          {matchingUniversities.length === 0 ? (
            <p className="no-result">
              {t("No universities found for this specific search.", "لم يتم العثور على جامعات لهذا البحث المحدد.")}
            </p>
          ) : (
            <>
              <div className="uni-grid">
                {displayedUniversities.map((u) => {
                  const firstProg = Object.keys(u.programmes)[0] || "";
                  const waText = encodeURIComponent(t(
                      `Hello, I am interested in the ${firstProg} at ${u.university}. Could you provide more details?`,
                      `مرحباً، أنا مهتم ببرنامج ${translateProgramName(firstProg, 'ar')} في ${u.university}. هل يمكنك تقديم المزيد من التفاصيل؟`
                  ));

                  return (
                    <div key={u.university} className="uni-card">
                      <div className="uni-header">
                        <img className="uni-logo" src={`https://ui-avatars.com/api/?name=${u.shortName}&background=random&color=fff&font-size=0.4`} alt={u.shortName} />
                        <div>
                          <div className="uni-name">{u.university}</div>
                          <div className="uni-small"><strong>{t("Type", "النوع")}:</strong> {universityTypes[u.shortName] || u.type}</div>
                          <div className="uni-small"><strong>{t("Location", "الموقع")}:</strong> {translateLocation(u.location, lang) || t("Malaysia", "ماليزيا")}</div>
                          <div className="uni-small"><strong>{t("Intakes", "مواعيد القبول")}:</strong> {translateIntakes(u.intakes, lang) || t("Check Website", "راجع الموقع")}</div>
                        </div>
                      </div>

                      <div className="prog-list">
                        {Object.entries(u.programmes).map(([progName, priceStr]) => {
                          const specs = getProgramSpecs(progName, lang);
                          const isShortlisted = shortlist.some(item => item.id === `${u.shortName}-${progName}`);
                          const ieltsWa = encodeURIComponent(t(
                            `Hello, I need help reaching an IELTS score of ${specs.ielts} for ${progName} at ${u.shortName}.`,
                            `مرحباً، أحتاج مساعدة للوصول لدرجة ${specs.ielts} في الآيلتس لبرنامج ${translateProgramName(progName, 'ar')} في ${u.shortName}.`
                          ));

                          const notifyId = `${u.shortName}-${progName}`;
                          const isNotified = !!notifiedIds[notifyId];
                          return (
                          <div key={progName} className="prog-item">
                            <div className="prog-item-header">
                              <div className="prog-item-title">{translateProgramName(progName, lang)}</div>
                              <input 
                                type="checkbox" 
                                className="compare-checkbox" 
                                checked={isShortlisted} 
                                onChange={() => handleShortlist(u, progName, priceStr, specs)}
                                title={t("Shortlist to Compare", "إضافة للمقارنة")}
                              />
                            </div>
                            
                            <div className="prog-item-price">
                              {formatPrice(priceStr, u.currency, currency)}
                            </div>

                            <div className="prog-item-specs">
                              <span className="spec-badge">⏳ {t("Duration:", "المدة:")} {specs.duration}</span>
                              <div style={{display:'flex', flexDirection:'column'}}>
                                <span className="spec-badge">📝 {t("IELTS:", "الآيلتس:")} {specs.ielts}</span>
                                {specs.ielts && specs.ielts !== "Check Website" && specs.ielts !== "راجع الموقع" && (
                                  <a href={`https://wa.link/12k9wf?text=${ieltsWa}`} target="_blank" rel="noopener noreferrer" className="ielts-upsell">
                                    {t("Need help reaching this score?", "هل تحتاج مساعدة للوصول لهذه الدرجة؟")}
                                  </a>
                                )}
                              </div>
                            </div>

                            {onSelectProgram && (
                              <button
                                type="button"
                                className={`notify-btn${isNotified ? ' is-sent' : ''}`}
                                disabled={isNotified}
                                onClick={() => handleNotifyInterest(u, progName, priceStr, specs)}
                                title={t("Send this program to your NEXTGENZ advisor", "أرسل هذا البرنامج لمستشارك في NEXTGENZ")}
                              >
                                {isNotified
                                  ? <>✓ {t("Advisor Notified", "تم إشعار المستشار")}</>
                                  : <>📩 {t("Notify My Advisor", "أخبر مستشاري")}</>}
                              </button>
                            )}
                          </div>
                        )})}
                      </div>
                      
                      <div className="card-actions">
                        <a href={`https://wa.link/12k9wf?text=${waText}`} target="_blank" rel="noopener noreferrer" className="consult-btn">
                          {t("Consult an Expert", "استشر خبيراً")}
                        </a>

// Full-screen "Find Your Program" tool embedded inside the Student, Agent and Admin portals.
// Wraps the ported ProgramFinderApp in the same modal chrome used elsewhere in the app, and
// forwards each "Notify My Advisor" click into a single onProgramInterest callback that the
// portal wires up to the existing email/Firebase alert pipeline.
interface ProgramFinderModalProps {
  isOpen: boolean;
  onClose: () => void;
  currentUser?: PortalUser | null;
  onProgramInterest?: (details: {
    university: string;
    universityShort: string;
    program: string;
    price: string;
    duration: string;
    ielts: string;
    location: string;
  }) => void;
}
const ProgramFinderModal: React.FC<ProgramFinderModalProps> = ({ isOpen, onClose, currentUser, onProgramInterest }) => {
  const [justSent, setJustSent] = useState<{ program: string; university: string } | null>(null);
  useEffect(() => {
    if (!justSent) return;
    const timer = setTimeout(() => setJustSent(null), 7000);
    return () => clearTimeout(timer);
  }, [justSent]);
  if (!isOpen) return null;
  return (
    <div className="fixed inset-0 bg-[#F5F7FA] z-[100002] overflow-y-auto w-full h-full">
      <div className="bg-[#0F1F38] text-white px-6 md:px-8 py-4 flex flex-wrap justify-between items-center gap-3 shadow-lg sticky top-0 z-20">
        <div className="flex items-center gap-3">
          <button contentEditable={false} suppressContentEditableWarning
            onClick={onClose}
            className="bg-white/10 hover:bg-[#C5A059] hover:text-[#0F1F38] text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 cursor-pointer"
          >
            <i className="fa-solid fa-arrow-left"></i> Back to Dashboard
          </button>
          <span className="text-gray-400 hidden sm:inline">/</span>
          <div className="items-center gap-2 hidden sm:flex">
            <i className="fa-solid fa-magnifying-glass text-lg text-[#C5A059]"></i>
            <h2 className="font-heading font-bold text-lg">Find Your Program</h2>
          </div>
        </div>
        <button contentEditable={false} suppressContentEditableWarning
          onClick={onClose}
          className="bg-white/10 hover:bg-white/20 px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 cursor-pointer"
        >
          <i className="fa-solid fa-xmark"></i> Close
        </button>
      </div>
      <div className="px-4 md:px-8 py-6 max-w-[1300px] mx-auto">
        {justSent && (
          <div className="pf-scope">
            <div className="pf-toast">
              <i className="fa-solid fa-circle-check"></i>
              Sent! Your advisor has been notified that you're interested in <strong>&nbsp;{justSent.program}&nbsp;</strong> at <strong>&nbsp;{justSent.university}</strong>. Expect a reply in your Portal Chat soon.
            </div>
          </div>
        )}
        <ProgramFinderApp
          currentUser={currentUser}
          onSelectProgram={(details: any) => {
            setJustSent({ program: details.program, university: details.university });
            if (onProgramInterest) onProgramInterest(details);
          }}
        />
      </div>
    </div>
  );
};

// ==== App.tsx ====
function App() {
// Live Firebase-backed states (replaces old localStorage persistence).
// Each collection loads from Firebase Realtime Database on mount, stays in sync via
// a live listener, and writes back any local change once the initial load has completed.
const [users, setUsers] = useState<PortalUser[]>(INITIAL_USERS);
const [students, setStudents] = useState<StudentRecord[]>(INITIAL_STUDENTS);
const [requests, setRequests] = useState<AccessRequest[]>(INITIAL_REQUESTS);
const [messages, setMessages] = useState<ChatMessage[]>(INITIAL_MESSAGES);
// Admin-adjustable page layout: which sections show, and in what order.
const [sectionOrder, setSectionOrder] = useState<string[]>(DEFAULT_SECTION_ORDER);
const [hiddenSections, setHiddenSections] = useState<string[]>([]);
const layoutLoadedRef = useRef(false);
// Guards so the initial snapshot pulled FROM Firebase doesn't immediately get written back,
// and so local default state isn't pushed up before the real data has had a chance to load.
const usersLoadedRef = useRef(false);
const studentsLoadedRef = useRef(false);
const requestsLoadedRef = useRef(false);
const messagesLoadedRef = useRef(false);
const [firebaseReady, setFirebaseReady] = useState(false);
const [firebaseError, setFirebaseError] = useState('');
// Current authenticated Firebase admin user (null = not logged in as admin)
const [adminAuthUser, setAdminAuthUser] = useState<any>(null);
// True once we KNOW there's a live Firebase Auth session (anonymous or real admin) and the
// Realtime Database connection has had a chance to pick it up. Data listeners (and therefore
// every write-back effect, since those only run after a listener's initial snapshot arrives)
// are held off until this is true - without this gate, a fast action right after page load
// could send a write a moment before the auth token had actually reached the database
// connection, and get rejected with PERMISSION_DENIED even though the rules were correct.
const [authReady, setAuthReady] = useState(false);
// Agent/Student portal logins are a plain app-level username+password check (see
// handleLoginSubmit) - they never call firebase.auth(), so on their own that visitor has
// NO Firebase Auth session at all. If the Realtime Database security rules require
// "auth != null" to write (a very common default), every write an agent or student makes
// - registering a student, submitting a request, sending a chat message - gets silently
// rejected. The local screen still looks like it worked because React state updates first,
// but nothing is actually saved, so it's gone on refresh and Admin never sees it either.
// Signing everyone in anonymously (only if nobody is signed in yet) gives every visitor a
// valid auth token to satisfy that rule, without changing how the app-level portal login
// works. A real Admin sign-in later simply replaces this anonymous session.
useEffect(() => {
let cancelled = false;
// A truthy currentUser only means a user OBJECT is cached locally - it does not guarantee
// the ID token attached to it is fresh/valid yet. Explicitly fetching (and, if needed,
// force-refreshing) the token before flipping authReady closes that gap: by the time any
// database read/write is allowed to fire, we KNOW a verified token exists, not just an
// object reference that looks logged in.
const confirmReady = (user: any, forceRefresh: boolean) => {
user.getIdToken(forceRefresh)
.then(() => { if (!cancelled) setAuthReady(true); })
.catch((err: any) => {
console.error('Failed to obtain a valid auth token:', err);
if (!cancelled) {
setFirebaseError(
'Could not verify the database session (' + (err && err.message ? err.message : 'unknown error') + '). Try reloading the page.'
);
setAuthReady(true);
}
});
};
const establishAnonymousSession = () => {
firebase.auth().signInAnonymously()
.then((cred: any) => confirmReady(cred.user, false))
.catch((err: any) => {
console.error('Anonymous auth failed:', err);
if (!cancelled) {
setFirebaseError(
'Could not establish a database session (' + (err && err.message ? err.message : 'unknown error') +
'). Changes made in this session may not be saved - please check Firebase Authentication has "Anonymous" sign-in enabled.'
);
// Still let the app proceed (in degraded, read-mostly mode) instead of hanging forever.
setAuthReady(true);
}
});
};
// Single source of truth for the Firebase Auth session. This fires on initial load AND
// every time the session changes afterward - critically including the moment Admin signs
// out. Signing out (handleAdminSignOut -> firebase.auth().signOut()) tears down whatever
// session is active, anonymous or not, leaving the tab with NO session at all. Without a
// listener reacting to that "user is now null" transition, every write an agent/student
// makes afterward gets rejected with PERMISSION_DENIED ("NOT signed in") because the old
// one-time-on-mount sign-in effect never runs again. Re-establishing an anonymous session
// here every time `user` comes back null (fresh load OR just signed out) closes that gap.
//
// isAdminActive is intentionally keyed off `!!user && !user.isAnonymous` rather than just
// `!!user` - now that ordinary visitors also carry an anonymous Firebase session (needed to
// satisfy the "auth != null" database rule), `!!user` alone would wrongly flag any signed-in
// visitor - including anonymous ones - as Admin. Only a real (non-anonymous) sign-in counts.
const unsubscribe = firebase.auth().onAuthStateChanged((user: any) => {
if (cancelled) return;
setAdminAuthUser(user);
setIsAdminActive(!!user && !user.isAnonymous);
if (user) {
confirmReady(user, true);
} else {
establishAnonymousSession();
}
});
return () => { cancelled = true; unsubscribe(); };
}, []);
useEffect(() => {
if (!authReady) return;
const collections: [string, React.Dispatch<React.SetStateAction<any>>, any, React.MutableRefObject<boolean>][] = [
['users', setUsers, INITIAL_USERS, usersLoadedRef],
['students', setStudents, INITIAL_STUDENTS, studentsLoadedRef],
['requests', setRequests, INITIAL_REQUESTS, requestsLoadedRef],
['messages', setMessages, INITIAL_MESSAGES, messagesLoadedRef]
];
const refs: any[] = [];
let cancelled = false;
collections.forEach(([path, setter, seed, loadedRef]) => {
const dbRef = firebase.database().ref(path);
refs.push(dbRef);
dbRef.on(
'value',
(snapshot: any) => {
if (cancelled) return;
const val = snapshot.val();
loadedRef.current = true;
if (val !== null && val !== undefined) {
setter(val);
} else {
// First-ever run against a fresh database: seed it with the demo/starter data.
dbRef.set(seed);
setter(seed);
}
setFirebaseReady(true);
},
(err: any) => {
console.error('Firebase read error on "' + path + '":', err);
setFirebaseError(
'Could not connect to the live database (' + (err && err.message ? err.message : 'unknown error') + '). Changes will not be saved until this is resolved.'
);
}
);
});
return () => {
cancelled = true;
refs.forEach((r) => r.off());
};
}, [authReady]);
// Load the saved layout (section order + hidden sections) and keep it live-synced.
useEffect(() => {
if (!authReady) return;
const dbRef = firebase.database().ref('site_content/layout');
const listener = dbRef.on(
'value',
(snapshot: any) => {
const val = snapshot.val();
layoutLoadedRef.current = true;
if (val) {
setSectionOrder(val.order && val.order.length ? val.order : DEFAULT_SECTION_ORDER);
setHiddenSections(val.hidden || []);
}
},
(err: any) => console.error('Firebase read error on "site_content/layout":', err)
);
return () => dbRef.off('value', listener);
}, [authReady]);
useEffect(() => {
if (!layoutLoadedRef.current) return;
firebase
.database()
.ref('site_content/layout')
.set({ order: sectionOrder, hidden: hiddenSections })
.catch((err: any) => {
console.error('Failed to save layout:', err);
setFirebaseError('Could not save the page layout (' + (err && err.message ? err.message : 'unknown error') + '). Please try again or contact support.');
});
}, [sectionOrder, hiddenSections]);
const [emailAlerts, setEmailAlerts] = useState<EmailAlertLog[]>(() => {

// Listen for emails dispatched from components outside App's own state (e.g. the public
// "Become an Agent" and "Free Advisory" forms), so the Email Dispatch Logs panel and the
// live toast stay accurate no matter which part of the app sent the email.
useEffect(() => {
const onNewAlert = (e: any) => {
const alertLog: EmailAlertLog = e.detail;
setEmailAlerts((prev) => (prev.some((a) => a.id === alertLog.id) ? prev : [alertLog, ...prev]));

const onUpdateAlert = (e: any) => {

setEmailAlerts((prev) => prev.map((item) => (item.id === id ? { ...item, status } : item)));

window.addEventListener('nextgenz-email-alert', onNewAlert);
window.addEventListener('nextgenz-email-alert-update', onUpdateAlert);
return () => {

// Backward-compatible wrapper around dispatchAppEmailToMany - sends the formatted, signed

// firebase /programInterests for the Admin panel.
const handleProgramInterest = (details: {
university: string;
universityShort: string;
program: string;
price: string;
duration: string;
ielts: string;
location: string;
}) => {
const requesterName = currentUser ? currentUser.name : (isAdminActive ? 'NEXTGENZ Admin' : 'Portal Visitor');
const requesterEmail = currentUser ? currentUser.email : '';
const requesterRole = currentUser ? currentUser.type : 'admin';

const subject = `[Program Interest] ${requesterName} - ${details.program} @ ${details.universityShort}`;
const bodyIntro = `${requesterName} (${requesterRole}) used Find Your Program and requested more information about a program.`;
const bodyDetails = [
`University: ${details.university}`,
`Program: ${details.program}`,
`Estimated Fee: ${details.price}`,
`Duration: ${details.duration}`,
`IELTS Requirement: ${details.ielts}`,
`Location: ${details.location}`
].join('\n');

// Helper to snapshot current state before mutations for UNDO
const pushStateToUndo = () => {
